# Throwaway diagnostic for DIY-102 -- tests the guessed ILI9341 SPI pins and
# FT6336 touch interrupt pin on the AliExpress 2.8" capacitive board.
#
# Expects: backlight on, screen fills solid red, and tapping the screen logs
# "Touch at x=.. y=.." over serial.

esphome:
  name: display-touch-test

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG

output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Backlight"
    id: backlight
    restore_mode: ALWAYS_ON

spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13
  miso_pin: GPIO12

display:
  - platform: ili9xxx
    model: ILI9341
    invert_colors: true
    cs_pin: GPIO15
    dc_pin: GPIO2
    reset_pin: GPIO4
    dimensions:
      width: 240
      height: 320
    update_interval: never
    lambda: |-
      it.fill(Color(255, 0, 0));

i2c:
  id: i2c_bus
  sda: GPIO33
  scl: GPIO32
  scan: true

touchscreen:
  - platform: ft63x6
    id: tft_touch
    i2c_id: i2c_bus
    on_touch:
      - logger.log:
          format: "Touch at x=%d y=%d"
          args: [touch.x, touch.y]
