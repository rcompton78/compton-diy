name: CI

on:
  push:
    branches: [master]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: [self-hosted, compton-diy]
    permissions:
      contents: write
    env:
      NX_CACHE_DIRECTORY: /hdd/compton-diy/nx-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Configure git
        run: git config --local --add safe.directory "$GITHUB_WORKSPACE"

      - name: Prepare persistent cache directories
        run: |
          mkdir -p /hdd/compton-diy/venv-root /hdd/compton-diy/venv-espframe \
            /hdd/compton-diy/platformio-core-root /hdd/compton-diy/platformio-core-espframe \
            "$NX_CACHE_DIRECTORY"
          ln -sfn /hdd/compton-diy/venv-root .venv
          ln -sfn /hdd/compton-diy/venv-espframe apps/espframe/.venv
          ln -sfn /hdd/compton-diy/platformio-core-root .platformio-core
          ln -sfn /hdd/compton-diy/platformio-core-espframe apps/espframe/.platformio-core

      - name: Compute version
        id: version
        run: |
          echo "version=$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Compute affected base
        id: base
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if git rev-parse -q --verify refs/tags/last-release >/dev/null; then
            BASE=$(git rev-parse refs/tags/last-release)
          else
            BASE="$EVENT_BEFORE"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
              BASE=$(git rev-parse HEAD~1)
            fi
          fi
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"

      - name: Install PlatformIO
        run: |
          if [ ! -x .venv/bin/python3 ]; then
            python3.12 -m venv .venv
          fi
          .venv/bin/pip install --upgrade --quiet platformio
          .venv/bin/python3 -m platformio system info

      - name: Install ESPHome
        run: |
          ESPHOME_VERSION="$(python3 -c "import json; print(json.load(open('apps/espframe/product/contract/project.json'))['esphome_version'])")"
          CURRENT_VERSION="$(apps/espframe/.venv/bin/esphome version 2>/dev/null | awk '{print $2}')"
          if [ "$CURRENT_VERSION" != "$ESPHOME_VERSION" ]; then
            echo "ESPHome $CURRENT_VERSION -> $ESPHOME_VERSION: rebuilding venv"
            rm -rf /hdd/compton-diy/venv-espframe
            mkdir -p /hdd/compton-diy/venv-espframe
            python3.12 -m venv apps/espframe/.venv
            apps/espframe/.venv/bin/pip install --quiet "esphome==$ESPHOME_VERSION"
          else
            echo "ESPHome $ESPHOME_VERSION already installed, reusing venv"
          fi

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Configure private registry auth
        run: echo "//rcompton78.bytesafe.dev/r/compton/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install Node dependencies
        run: pnpm install

      - name: Build all firmware
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          CAT_BUDDY_API_TOKEN: ${{ secrets.CAT_BUDDY_API_TOKEN }}
        run: |
          pnpm nx run-many -t build
          pnpm nx run-many -t build-fs

      - name: Generate releases
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          CAT_BUDDY_API_TOKEN: ${{ secrets.CAT_BUDDY_API_TOKEN }}
        run: pnpm nx run-many -t release

      - name: Generate flasher index
        run: python3 tools/esp-flasher/generate_index.py --version="${{ steps.version.outputs.version }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist/

      - name: Determine affected firmware projects
        id: affected
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          PROJECTS=$(pnpm nx show projects --affected --withTarget release \
            --base="$BASE_SHA" --head="$HEAD_SHA" --json \
            | jq -r '.[]')
          {
            echo "projects<<EOF"
            echo "$PROJECTS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.affected.outputs.projects != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AFFECTED_PROJECTS: ${{ steps.affected.outputs.projects }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          shopt -s nullglob
          ASSETS=()
          while IFS= read -r project; do
            [ -z "$project" ] && continue
            ASSETS+=(dist/"$project"/*-ota.bin)
          done <<< "$AFFECTED_PROJECTS"

          gh release create "$RELEASE_VERSION" \
            "${ASSETS[@]}" \
            --title "Firmware $RELEASE_VERSION" \
            --notes "Automated build from $COMMIT_SHA. Changed: $(echo "$AFFECTED_PROJECTS" | paste -sd, -). Upload the *-ota.bin matching your device via its config portal's Update page."

      - name: Advance last-release tag
        if: steps.affected.outputs.projects != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/git/refs/tags/last-release" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/last-release" -f sha="${{ github.sha }}" -F force=true
          else
            gh api -X POST "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/last-release" -f sha="${{ github.sha }}"
          fi

  deploy-pages:
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
