name: CI

on:
  push:
    branches: [master]
  # Manual re-release of unchanged projects, e.g. after rotating a secret baked
  # in at build time (see "Resolve release versions" below).
  workflow_dispatch:
    inputs:
      force_bump:
        description: "Comma-separated projects to re-release under a new version even if unchanged (or 'all')"
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: [self-hosted, compton-diy]
    permissions:
      contents: write
    env:
      NX_CACHE_DIRECTORY: /hdd/compton-diy/nx-cache
      NX_WORKSPACE_DATA_DIRECTORY: /hdd/compton-diy/nx-workspace-data
    steps:
      # A manual run from any other ref would publish its builds to Pages and
      # cut a release from it. Fail loudly rather than skip, so it's obvious.
      - name: Require master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::Run this workflow on master (got $GITHUB_REF)."
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Configure git
        run: git config --local --add safe.directory "$GITHUB_WORKSPACE"

      - name: Prepare persistent cache directories
        run: |
          mkdir -p /hdd/compton-diy "$NX_CACHE_DIRECTORY" "$NX_WORKSPACE_DATA_DIRECTORY"
          ln -sfn /hdd/compton-diy/venv-root .venv
          ln -sfn /hdd/compton-diy/venv-espframe apps/espframe/.venv
          ln -sfn /hdd/compton-diy/platformio-core-root .platformio-core
          ln -sfn /hdd/compton-diy/platformio-core-espframe apps/espframe/.platformio-core
          ln -sfn /hdd/compton-diy/venv-espframe-stand apps/espframe/hardware/stand/.venv
          ln -sfn /hdd/compton-diy/venv-espframe-stand-10 apps/espframe/hardware/stand-10/.venv
          ln -sfn /hdd/compton-diy/venv-media-room-remote-enclosure apps/media-room-dashboard/hardware/enclosure/.venv
          # Per-app PlatformIO lib_deps (COM-524): re-installing them on every run hit the
          # registry's per-IP download limit. Targets are pre-created because PlatformIO
          # can't create a dir through a dangling symlink, and kept per app because env
          # names (e.g. freenove-s3) repeat across apps with different lib_deps.
          for ini in apps/*/platformio.ini; do
            app="$(basename "$(dirname "$ini")")"
            mkdir -p "apps/$app/.pio" "/hdd/compton-diy/libdeps-$app"
            rm -rf "apps/$app/.pio/libdeps"
            ln -sfn "/hdd/compton-diy/libdeps-$app" "apps/$app/.pio/libdeps"
          done

      - name: Compute version
        id: version
        run: |
          echo "version=$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Compute affected base
        id: base
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if git rev-parse -q --verify refs/tags/last-release >/dev/null; then
            BASE=$(git rev-parse refs/tags/last-release)
          else
            BASE="$EVENT_BEFORE"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
              BASE=$(git rev-parse HEAD~1)
            fi
          fi
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"

      - name: Install PlatformIO
        run: |
          if [ ! -x .venv/bin/python3 ]; then
            python3.12 -m venv /hdd/compton-diy/venv-root
          fi
          .venv/bin/pip install --upgrade --quiet platformio
          .venv/bin/python3 -m platformio system info

      - name: Install ESPHome
        run: |
          ESPHOME_VERSION="$(python3 -c "import json; print(json.load(open('apps/espframe/product/contract/project.json'))['esphome_version'])")"
          CURRENT_VERSION="$(apps/espframe/.venv/bin/esphome version 2>/dev/null | awk '{print $2}')"
          if [ "$CURRENT_VERSION" != "$ESPHOME_VERSION" ]; then
            echo "ESPHome $CURRENT_VERSION -> $ESPHOME_VERSION: rebuilding venv"
            rm -rf /hdd/compton-diy/venv-espframe
            python3.12 -m venv /hdd/compton-diy/venv-espframe
            apps/espframe/.venv/bin/pip install --quiet "esphome==$ESPHOME_VERSION"
          else
            echo "ESPHome $ESPHOME_VERSION already installed, reusing venv"
          fi

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Configure private registry auth
        run: echo "//rcompton78.bytesafe.dev/r/compton/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install Node dependencies
        run: pnpm install

      # Per-project versions (COM-428): only projects that changed since the
      # last release get this run's version. Every other release project keeps
      # its last release's version, so devices (which reinstall on any version
      # mismatch) don't reinstall identical code after unrelated merges. The
      # bumped list also drives the GitHub release below.
      - name: Resolve release versions
        id: affected
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          FORCE_BUMP: ${{ inputs.force_bump }}
        run: |
          python3 tools/esp-flasher/resolve_versions.py \
            --base "$BASE_SHA" --head "$HEAD_SHA" --version "$RELEASE_VERSION" \
            --force-bump "$FORCE_BUMP" \
            --output "$RUNNER_TEMP/release-versions.json"
          {
            echo "projects<<EOF"
            jq -r '.bumped[]' "$RUNNER_TEMP/release-versions.json"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build all firmware
        env:
          CAT_BUDDY_API_TOKEN: ${{ secrets.CAT_BUDDY_API_TOKEN }}
          # Per-app secrets for scripts/write-secrets.sh (COM-463); strict, so a missing one fails the run.
          REQUIRE_APP_SECRETS: "1"
          MEDIA_ROOM_DASHBOARD_API_ENCRYPTION_KEY: ${{ secrets.MEDIA_ROOM_DASHBOARD_API_ENCRYPTION_KEY }}
        run: |
          scripts/release-run.sh "$RUNNER_TEMP/release-versions.json" build
          scripts/release-run.sh "$RUNNER_TEMP/release-versions.json" build-fs

      # build123d + OCP for the hardware projects' print files (espframe 7" and 10" stands, media-room
      # remote enclosure). Each setup.sh resolves its .venv symlink itself and only
      # rebuilds when its requirements.txt changes.
      - name: Install CAD envs
        timeout-minutes: 30
        run: |
          pnpm nx run espframe-stand:cad-setup
          pnpm nx run espframe-stand-10:cad-setup
          pnpm nx run media-room-remote-enclosure:cad-setup

      - name: Generate releases
        env:
          CAT_BUDDY_API_TOKEN: ${{ secrets.CAT_BUDDY_API_TOKEN }}
          # Per-app secrets for scripts/write-secrets.sh (COM-463); strict, so a missing one fails the run.
          REQUIRE_APP_SECRETS: "1"
          MEDIA_ROOM_DASHBOARD_API_ENCRYPTION_KEY: ${{ secrets.MEDIA_ROOM_DASHBOARD_API_ENCRYPTION_KEY }}
        run: scripts/release-run.sh "$RUNNER_TEMP/release-versions.json" release

      - name: Generate flasher index
        run: python3 tools/esp-flasher/generate_index.py --version="${{ steps.version.outputs.version }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist/

      - name: Create GitHub release
        if: steps.affected.outputs.projects != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AFFECTED_PROJECTS: ${{ steps.affected.outputs.projects }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          shopt -s nullglob
          FIRMWARE=()
          PRINTS=()
          while IFS= read -r project; do
            [ -z "$project" ] && continue
            FIRMWARE+=(dist/"$project"/*-ota.bin)
            PRINTS+=(dist/"$project"/*.tar.gz)
          done <<< "$AFFECTED_PROJECTS"

          # resolve_versions.py reads the "Changed: a,b." list back to find each
          # project's last release, so keep its format.
          NOTES="Automated build from $COMMIT_SHA. Changed: $(echo "$AFFECTED_PROJECTS" | paste -sd, -)."
          if [ ${#FIRMWARE[@]} -gt 0 ]; then
            NOTES="$NOTES"$'\n\n'"Firmware: upload the *-ota.bin matching your device via its config portal's Update page."
          fi
          if [ ${#PRINTS[@]} -gt 0 ]; then
            NOTES="$NOTES"$'\n\n'"Print files: download the *.tar.gz (3MF/STL/STEP print files, fit and tip-over checks, README and preview renders) and see its README for print settings and assembly."
          fi
          if [ ${#FIRMWARE[@]} -gt 0 ] && [ ${#PRINTS[@]} -gt 0 ]; then
            TITLE="Release $RELEASE_VERSION"
          elif [ ${#PRINTS[@]} -gt 0 ]; then
            TITLE="Print files $RELEASE_VERSION"
          else
            TITLE="Firmware $RELEASE_VERSION"
          fi

          gh release create "$RELEASE_VERSION" \
            "${FIRMWARE[@]}" "${PRINTS[@]}" \
            --title "$TITLE" \
            --notes "$NOTES"

      - name: Advance last-release tag
        if: steps.affected.outputs.projects != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/git/refs/tags/last-release" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/last-release" -f sha="${{ github.sha }}" -F force=true
          else
            gh api -X POST "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/last-release" -f sha="${{ github.sha }}"
          fi

  deploy-pages:
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
