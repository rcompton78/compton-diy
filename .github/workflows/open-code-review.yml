name: Open Code Review (DeepSeek)

# DIY-94 follow-up: calls the reusable version of this workflow, extracted to
# rcompton78/gh-actions so other repos can use the same gate. Pinned to @v1 —
# bump deliberately, don't float on @main.
#
# DIY-95 TEMP: pointed at the unreleased gh-actions feature branch to exercise the new
# reply-driven suppression logic live on this PR before it's tagged @v2. Revert to @v1
# (or bump to @v2 once tagged) before merging DIY-66.
on:
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs never get repo secrets on the pull_request event — skip cleanly instead of
    # failing on a missing DEEPSEEK_API_KEY. Lives here (the caller) rather than in the
    # reusable workflow, since github.repository there wouldn't resolve to this repo.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    uses: rcompton78/gh-actions/.github/workflows/open-code-review.yml@feature/diy-95-reply-driven-pr-suppression
    secrets: inherit
