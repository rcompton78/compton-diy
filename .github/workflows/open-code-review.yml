name: Open Code Review (DeepSeek)

# DIY-94 follow-up: calls the reusable version of this workflow, extracted to
# rcompton78/gh-actions so other repos can use the same gate. Pinned to @v2 —
# bump deliberately, don't float on @main.
#
# DIY-95: @v2 adds reply-driven, per-PR suppression — reply /ocr-accept or
# /ocr-defer TICKET-123 on a posted finding's thread to suppress it for this PR only.
on:
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs never get repo secrets on the pull_request event — skip cleanly instead of
    # failing on a missing DEEPSEEK_API_KEY. Lives here (the caller) rather than in the
    # reusable workflow, since github.repository there wouldn't resolve to this repo.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    uses: rcompton78/gh-actions/.github/workflows/open-code-review.yml@v2
    secrets: inherit
