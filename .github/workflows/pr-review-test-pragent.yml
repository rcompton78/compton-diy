name: PR Review Test - PR-Agent (DeepSeek)

# DIY-94 spike: PR-Agent's official Docker action only runs on pull_request/issue_comment
# events (it reads PR context from GITHUB_EVENT_PATH), so it can't be pointed at an
# arbitrary PR from workflow_dispatch. Run the pip-installed CLI directly instead —
# `pr-agent --pr_url=<url> review` is PR-Agent's documented CLI entrypoint and honors
# the same dynaconf SECTION.KEY env var overrides as the Docker action.
on:
  workflow_dispatch:
    inputs:
      pr_url:
        description: 'Full URL of an existing PR on this repo to review'
        required: true
        type: string
      post_comment:
        description: 'Actually post the review as a PR comment (unchecked = log-only, no PR noise)'
        required: false
        type: boolean
        default: false

jobs:
  pr-agent-deepseek:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PR-Agent
        run: pip install pr-agent

      - name: Run PR-Agent review
        env:
          PR_URL: ${{ inputs.pr_url }}
          github.user_token: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK.KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          config.model: 'deepseek/deepseek-chat'
          config.fallback_models: '["deepseek/deepseek-chat"]'
          config.publish_output: ${{ inputs.post_comment }}
        run: pr-agent --pr_url="$PR_URL" review
