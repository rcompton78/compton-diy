# =============================================================================
# DASHBOARD APP LOGIC - board-agnostic
# =============================================================================
# WiFi/API/logger, OTA + auto-update checking (same http_request-manifest
# mechanism as espframe, see apps/espframe/common/addon/firmware_update.yaml),
# and the 6-button LVGL touch UI calling Home Assistant services directly
# over the native API (`homeassistant.service`). Button state (TV power,
# active HDMI input, light on/off) comes back down the same connection via
# `homeassistant` text sensors subscribed to exactly the entities the buttons
# control -- all `internal: true`, so the device still exposes no entities of
# its own to HA. It's a remote with feedback, not a general HA dashboard.
#
# Requires a board package to have already defined `tft_display` (display)
# and `tft_touch` (touchscreen) — see boards/freenove-s3.yaml.
# =============================================================================

substitutions:
  firmware_version: "dev"
  firmware_manifest_url: "https://rcompton78.github.io/compton-diy/media-room-dashboard/manifest.json"
  # Roku TV entities. remote.* carries power (on/off, "off" in standby);
  # the media_player's `app_id` attribute carries the active input as
  # `tvinput.hdmiN` -- used instead of `source`, which is the user-editable
  # input name and would break if an input got renamed on the TV (both
  # already are: hdmi1 shows as "PlayStation 5", hdmi3 as "Fire TV"). While
  # the TV is off HA drops the `app_id` attribute entirely.
  tv_remote: "remote.living_room_tv"
  tv_media_player: "media_player.living_room_tv"
  tv_game_app_id: "tvinput.hdmi1"
  tv_watch_app_id: "tvinput.hdmi3"

esphome:
  project:
    name: "compton-diy.media-room-dashboard"
    version: "${firmware_version}"

# No compile-time ssid/password: this device relies entirely on the
# captive-portal flow below to get station wifi credentials at runtime
# (submitted once via the fallback AP, then persisted to the ESP32's NVS
# flash partition — separate from the OTA app partition, so it survives
# firmware updates without needing to be baked into every build). Same
# mechanism as apps/espframe's factory image (apps/espframe/builds/
# freenove-s3.yaml).
wifi:
  # No AP password: it's a short, physically-supervised setup window, and an
  # open network is one less thing to type on a phone.
  ap:
    ssid: "${friendly_name} Setup"
  # Switches which LVGL page is shown -- without this, the setup AP exists
  # and works but nothing on the device's own screen tells you it's there
  # (you'd only find it by checking a phone's wifi list), and the 6 buttons
  # would sit there doing nothing useful before HA is even reachable.
  #
  # on_connect/on_disconnect only fire on a real connected<->disconnected
  # edge, not on each failed retry, so neither of them can tell "still
  # retrying the saved network" from "gave up, fallback AP is up". The
  # interval below watches for the latter (`wifi.ap_active`) and swaps in
  # setup_page once. These handlers reset its one-shot guard so a later
  # drop -> AP cycle shows setup_page again.
  on_connect:
    - globals.set:
        id: setup_page_shown
        value: "false"
    - lvgl.page.show: main_page
  on_disconnect:
    - globals.set:
        id: setup_page_shown
        value: "false"
    - lvgl.page.show: connecting_page

globals:
  - id: setup_page_shown
    type: bool
    initial_value: "false"

# Moves from connecting_page to setup_page once the fallback AP is actually
# up. (An earlier attempt at this split seemed to hang the device, but that
# turned out to be the display init bug fixed in boards/freenove-s3.yaml --
# see COM-213 -- not anything about switching pages while the AP runs.)
interval:
  - interval: 1s
    then:
      - if:
          condition:
            and:
              - wifi.ap_active:
              - lambda: 'return !id(setup_page_shown);'
          then:
            - globals.set:
                id: setup_page_shown
                value: "true"
            - lvgl.page.show: setup_page

captive_portal:

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key
  # Once HA is gone the imported states below are frozen at whatever they
  # last were, so drop every button back to neutral rather than show state
  # that may no longer be true. HA re-sends every subscribed state when it
  # reconnects, which repaints them. Only reset when no state-subscribed
  # client remains, so an `esphome logs` session disconnecting doesn't
  # blank the buttons while HA is still connected.
  on_client_disconnected:
    - if:
        condition:
          not:
            api.connected:
              state_subscription_only: true
        then:
          - script.execute: reset_button_states

# -----------------------------------------------------------------------------
# OTA + auto-update check against the GitHub Pages manifest (see CLAUDE.md's
# "Release workflow" section — dist/media-room-dashboard/manifest.json).
# -----------------------------------------------------------------------------
http_request:

ota:
  - platform: http_request

update:
  - platform: http_request
    id: firmware_update
    name: "Firmware Update"
    source: ${firmware_manifest_url}
    update_interval: 6h
    on_update_available:
      then:
        # firmware_version is never substituted with the real RELEASE_VERSION
        # at build time (generate_release.py's --version only feeds
        # manifest.json, not the compiled binary), so every "dev" build
        # always mismatches the published manifest version and would
        # otherwise auto-install on every boot forever, including a fresh
        # ota.perform right after the one that just ran (since the OTA'd
        # binary is also always "dev"). Skip auto-install entirely for
        # unversioned/local builds -- matches libs/ota-update-client's
        # existing currentVersion=="dev" skip for the same reason.
        - if:
            condition:
              lambda: 'return strcmp("${firmware_version}", "dev") != 0;'
            then:
              - update.perform: firmware_update

text_sensor:
  - platform: template
    name: "Firmware Version"
    entity_category: diagnostic
    update_interval: never
    lambda: 'return {"${firmware_version}"};'

  # ---------------------------------------------------------------------------
  # Button state imported from HA. Text sensors rather than `homeassistant`
  # binary sensors so "unavailable"/"unknown" are visible as their own
  # values instead of collapsing into off. None of these need the "Allow the
  # device to perform Home Assistant actions" toggle -- HA pushes subscribed
  # states to any paired device. The buttons are deliberately not
  # `checkable`, so a tap never flips the highlight by itself: it only
  # changes once HA confirms the new state.
  # ---------------------------------------------------------------------------
  - platform: homeassistant
    id: tv_power
    entity_id: ${tv_remote}
    internal: true
    on_value:
      # Label names the action a tap performs; the checked (lit) style shows
      # the current state. Anything other than on/off (unavailable, unknown)
      # falls back to the neutral pre-feedback label.
      - lvgl.label.update:
          id: lbl_roku_power
          text: !lambda 'return std::string(x == "on" ? "Power\nOff" : (x == "off" ? "Power\nOn" : "Roku\nPower"));'
      - lvgl.widget.update:
          id: btn_roku_power
          state:
            checked: !lambda 'return x == "on";'
      - script.execute: refresh_input_buttons

  - platform: homeassistant
    id: tv_app_id
    entity_id: ${tv_media_player}
    attribute: app_id
    internal: true
    on_value:
      - script.execute: refresh_input_buttons

  - platform: homeassistant
    id: window_lamp_state
    entity_id: light.media_room_window_lamp_2
    internal: true
    on_value:
      - lvgl.widget.update:
          id: btn_window_lamp
          state:
            checked: !lambda 'return x == "on";'

  - platform: homeassistant
    id: window_lights_state
    entity_id: light.window_lights
    internal: true
    on_value:
      - lvgl.widget.update:
          id: btn_window_lights
          state:
            checked: !lambda 'return x == "on";'

  - platform: homeassistant
    id: standing_lamp_state
    entity_id: switch.media_room_plug
    internal: true
    on_value:
      - lvgl.widget.update:
          id: btn_standing_lamp
          state:
            checked: !lambda 'return x == "on";'

script:
  # The Roku can keep reporting its last input's app_id while in standby, so
  # the input buttons are gated on power as well -- re-run whenever either
  # changes.
  - id: refresh_input_buttons
    then:
      - lvgl.widget.update:
          id: btn_roku_play_game
          state:
            checked: !lambda 'return id(tv_power).state == "on" && id(tv_app_id).state == "${tv_game_app_id}";'
      - lvgl.widget.update:
          id: btn_roku_watch_tv
          state:
            checked: !lambda 'return id(tv_power).state == "on" && id(tv_app_id).state == "${tv_watch_app_id}";'

  - id: reset_button_states
    then:
      - lvgl.label.update:
          id: lbl_roku_power
          text: "Roku\nPower"
      - lvgl.widget.update:
          id: [btn_roku_power, btn_roku_play_game, btn_roku_watch_tv, btn_window_lamp, btn_window_lights, btn_standing_lamp]
          state:
            checked: false

# -----------------------------------------------------------------------------
# Three LVGL pages. `connecting_page` (the default, i.e. at boot, and again
# whenever wifi drops) says the device is retrying its saved network;
# `setup_page` replaces it once that fails and the fallback AP comes up (see
# the interval above), naming the AP to join; `main_page` -- the 6-button
# dashboard, hidden until the device is actually reachable from HA -- is a 2
# column x 3 row grid over the full 240x320 portrait panel (this board's
# native, already-confirmed-working orientation, no rotation transform).
# Button -> HA service mapping is the finalized list from Jira DIY-102. Every
# button shares one theme: dim grey by default, lit amber when `checked` --
# which only the imported HA state above ever sets.
# -----------------------------------------------------------------------------
# byte_order: big_endian avoids a known LVGL+ili9xxx grey-screen bug hit on
# this same panel in apps/espframe (see project memory project_diy44_espframe
# — little_endian was copied verbatim from a different, mipi_dsi-based board
# and never validated against this SPI panel).
lvgl:
  displays: [tft_display]
  touchscreens: [tft_touch]
  byte_order: big_endian
  theme:
    button:
      bg_color: 0x303030
      text_color: 0xFFFFFF
      checked:
        bg_color: 0xF5A623
        text_color: 0x000000
  pages:
    - id: connecting_page
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        - label:
            x: 0
            y: 80
            width: 240
            text: "Connecting to WiFi"
            text_font: montserrat_14
            text_color: 0xFFFFFF
            align: TOP_MID
            text_align: CENTER
        - label:
            x: 0
            y: 110
            width: 240
            text: "${friendly_name}"
            text_font: montserrat_28
            text_color: 0xFFFFFF
            align: TOP_MID
            text_align: CENTER
    - id: setup_page
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        - label:
            x: 0
            y: 80
            width: 240
            text: "Connect to WiFi"
            text_font: montserrat_14
            text_color: 0xFFFFFF
            align: TOP_MID
            text_align: CENTER
        - label:
            x: 0
            y: 110
            width: 240
            text: "'${friendly_name} Setup'"
            text_font: montserrat_28
            text_color: 0xFFFFFF
            align: TOP_MID
            text_align: CENTER
        - label:
            x: 0
            y: 240
            width: 240
            text: "Join it from a phone to\nenter your wifi details"
            text_font: montserrat_14
            text_color: 0xFFFFFF
            align: TOP_MID
            text_align: CENTER
    - id: main_page
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        - button:
            id: btn_roku_power
            x: 8
            y: 8
            width: 108
            height: 96
            widgets:
              - label:
                  id: lbl_roku_power
                  text: "Roku\nPower"
                  align: CENTER
            on_click:
              - homeassistant.service:
                  service: remote.toggle
                  data:
                    entity_id: ${tv_remote}
        - button:
            id: btn_roku_play_game
            x: 124
            y: 8
            width: 108
            height: 96
            widgets:
              - label:
                  text: "Play\nGame"
                  align: CENTER
            on_click:
              - homeassistant.service:
                  service: remote.send_command
                  data:
                    entity_id: ${tv_remote}
                    device: cc6a35ae75dc995d71981ff3e2a4a3ae
                    command: input_hdmi1
        - button:
            id: btn_roku_watch_tv
            x: 8
            y: 112
            width: 108
            height: 96
            widgets:
              - label:
                  text: "Watch\nTV"
                  align: CENTER
            on_click:
              - homeassistant.service:
                  service: remote.send_command
                  data:
                    entity_id: ${tv_remote}
                    device: cc6a35ae75dc995d71981ff3e2a4a3ae
                    command: input_hdmi3
        - button:
            id: btn_window_lamp
            x: 124
            y: 112
            width: 108
            height: 96
            widgets:
              - label:
                  text: "Window\nLamp"
                  align: CENTER
            on_click:
              - homeassistant.service:
                  service: light.toggle
                  data:
                    entity_id: light.media_room_window_lamp_2
        - button:
            id: btn_window_lights
            x: 8
            y: 216
            width: 108
            height: 96
            widgets:
              - label:
                  text: "Window\nLights"
                  align: CENTER
            on_click:
              - homeassistant.service:
                  service: light.toggle
                  data:
                    entity_id: light.window_lights
        - button:
            id: btn_standing_lamp
            x: 124
            y: 216
            width: 108
            height: 96
            widgets:
              - label:
                  text: "Standing\nLamp"
                  align: CENTER
            on_click:
              - homeassistant.service:
                  service: switch.toggle
                  data:
                    entity_id: switch.media_room_plug
