# =============================================================================
# DASHBOARD APP LOGIC - board-agnostic
# =============================================================================
# WiFi/API/logger, OTA + auto-update checking (same http_request-manifest
# mechanism as espframe, see apps/espframe/common/addon/firmware_update.yaml),
# and the 6-button LVGL touch UI calling Home Assistant services directly
# over the native API (`homeassistant.service`) — no local entities, this
# device is a remote control, not a sensor.
#
# Requires a board package to have already defined `tft_display` (display),
# `tft_touch` (touchscreen), `deep_sleep_1` (deep_sleep, with its wake source
# configured), and `light_sleep_1`-equivalent automatic light sleep (the
# light_sleep external component) — see boards/freenove-s3.yaml.
# =============================================================================

substitutions:
  firmware_version: "dev"
  firmware_manifest_url: "https://rcompton78.github.io/compton-diy/media-room-dashboard/manifest.json"
  # COM-214: options 2 and 3 layered as idle tiers off the same LVGL
  # inactivity clock (lvgl's on_idle trigger below):
  #  - option 3 (automatic light sleep) runs continuously, no timeout of its
  #    own -- see boards/freenove-s3.yaml's light_sleep component.
  #  - option 2 (backlight off) kicks in after idle_timeout: screen goes
  #    dark, everything else (WiFi/API/light sleep) keeps running, so wake
  #    is instant, no reboot.
  # option 1 (deep sleep, a third tier off deep_sleep_timeout) is disabled --
  # see the on_idle comment below for why. deep_sleep_timeout is left
  # defined, unused, so re-enabling it later is a one-line change.
  idle_timeout: "20s"
  deep_sleep_timeout: "120min"

esphome:
  project:
    name: "compton-diy.media-room-dashboard"
    version: "${firmware_version}"

# No compile-time ssid/password: this device relies entirely on the
# captive-portal flow below to get station wifi credentials at runtime
# (submitted once via the fallback AP, then persisted to the ESP32's NVS
# flash partition — separate from the OTA app partition, so it survives
# firmware updates without needing to be baked into every build). Same
# mechanism as apps/espframe's factory image (apps/espframe/builds/
# freenove-s3.yaml).
wifi:
  # Skips the AP scan on connect, going straight for the BSSID+channel saved
  # from the last successful connection (persisted to NVS, survives
  # reboots) -- shaves a meaningful chunk off the deep-sleep wake reconnect
  # (COM-214 option 1), which is a full ESP32 reboot each time. Falls back
  # to a normal scan if the saved AP can't be reached (e.g. router reboot
  # changed channel), so this doesn't add a new failure mode.
  fast_connect: true
  # No AP password: it's a short, physically-supervised setup window, and an
  # open network is one less thing to type on a phone.
  ap:
    ssid: "${friendly_name} Setup"
  # Switches which LVGL page is shown -- without this, the setup AP exists
  # and works but nothing on the device's own screen tells you it's there
  # (you'd only find it by checking a phone's wifi list), and the 6 buttons
  # would sit there doing nothing useful before HA is even reachable.
  #
  # NOTE: on_disconnect fires for every transient drop, including retries
  # against the saved network, not just once the fallback AP truly comes up
  # -- there's no clean way to distinguish "still retrying" from "gave up,
  # AP is up" without checking wifi_component's is_ap_active(). Every way
  # tried to do that (a separate `interval: 1s` polling it and calling
  # lvgl.page.show from there, both repeating and one-shot-guarded; a
  # one-shot `delay: 15s` + conditional check inside on_disconnect itself)
  # reproduced the SAME failure: the device fully hangs (no serial output
  # at all, not just a bad render) the moment lvgl.page.show: setup_page
  # actually executes while the fallback AP + captive_portal are active --
  # reproduced 4 times across totally different trigger mechanisms and
  # setup_page content/position, which rules out our YAML being the cause.
  # Likely a real ESPHome/LVGL resource-contention bug with captive_portal's
  # DNS/web server, not something fixable by restructuring this file.
  # Reverted to a single combined message instead, which is fully stable.
  # See Jira DIY-105 for the full investigation before attempting this
  # split again.
  on_connect:
    - lvgl.page.show: main_page
  on_disconnect:
    - lvgl.page.show: setup_page

captive_portal:

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

# -----------------------------------------------------------------------------
# OTA + auto-update check against the GitHub Pages manifest (see CLAUDE.md's
# "Release workflow" section — dist/media-room-dashboard/manifest.json).
# -----------------------------------------------------------------------------
http_request:

ota:
  - platform: http_request

update:
  - platform: http_request
    id: firmware_update
    name: "Firmware Update"
    source: ${firmware_manifest_url}
    update_interval: 6h
    on_update_available:
      then:
        # firmware_version is never substituted with the real RELEASE_VERSION
        # at build time (generate_release.py's --version only feeds
        # manifest.json, not the compiled binary), so every "dev" build
        # always mismatches the published manifest version and would
        # otherwise auto-install on every boot forever, including a fresh
        # ota.perform right after the one that just ran (since the OTA'd
        # binary is also always "dev"). Skip auto-install entirely for
        # unversioned/local builds -- matches libs/ota-update-client's
        # existing currentVersion=="dev" skip for the same reason.
        - if:
            condition:
              lambda: 'return strcmp("${firmware_version}", "dev") != 0;'
            then:
              - update.perform: firmware_update

text_sensor:
  - platform: template
    name: "Firmware Version"
    entity_category: diagnostic
    update_interval: never
    lambda: 'return {"${firmware_version}"};'

# Instant wake for COM-214 option 2's backlight-off idle, below: extends the
# board's tft_touch (rather than adding a second touchscreen device) so the
# backlight snaps back on the moment a touch lands, without waiting on
# lvgl's on_idle to notice activity resumed.
touchscreen:
  - id: !extend tft_touch
    on_touch:
      - output.turn_on: backlight_output

# -----------------------------------------------------------------------------
# Two LVGL pages, switched by the wifi on_connect/on_disconnect handlers
# above: `setup_page` (shown by default, i.e. at boot before wifi connects --
# covers both "still retrying the saved network" and "gave up, join the
# fallback AP", see the NOTE on wifi.on_disconnect above for why those two
# cases share one page) explains how to configure wifi; `main_page` -- the
# 6-button dashboard, hidden until the device is actually reachable from HA
# -- is a 2 column x 3 row grid over the full 240x320 portrait panel (this
# board's native, already-confirmed-working orientation, no rotation
# transform). Button -> HA service mapping is the finalized list from Jira
# DIY-102.
# -----------------------------------------------------------------------------
# byte_order: big_endian avoids a known LVGL+ili9xxx grey-screen bug hit on
# this same panel in apps/espframe (see project memory project_diy44_espframe
# — little_endian was copied verbatim from a different, mipi_dsi-based board
# and never validated against this SPI panel).
lvgl:
  displays: [tft_display]
  touchscreens: [tft_touch]
  byte_order: big_endian
  # Tier 2 (deep sleep after deep_sleep_timeout) is DISABLED -- see
  # deep_sleep_1's comment in boards/freenove-s3.yaml and
  # light_sleep_component.h. THREE separate fixes attempted and confirmed
  # NOT to work on-device (each verified via a genuine USB re-enumeration,
  # not a log/cache artifact): rtc_gpio_pullup_en alone; adding
  # esp_sleep_pd_config to keep it powered through deep sleep; removing
  # deep_sleep_1's esp32_ext1_wakeup entirely to eliminate a suspected
  # conflict with light_sleep's own gpio wakeup registration. All three
  # still self-wake within seconds of entering deep sleep, no touch
  # involved. Plain deep sleep alone, before the light_sleep component
  # existed, was reliable -- so this is specifically a light_sleep +
  # deep_sleep interaction, root cause still unconfirmed. Needs real
  # investigation (e.g. known esp_pm-auto-light-sleep +
  # esp_deep_sleep_start interactions in ESP-IDF's own issue tracker) before
  # trying a fourth fix blind. Only tier 1 (backlight off) is active below;
  # light sleep (COM-214 option 3) keeps running regardless, unaffected.
  on_idle:
    - timeout: ${idle_timeout}
      then:
        - output.turn_off: backlight_output
    # Tier 2, disabled -- see the comment above. To re-enable once the root
    # cause is actually fixed, uncomment this block:
    # - timeout: ${deep_sleep_timeout}
    #   then:
    #     - if:
    #         condition:
    #           wifi.connected:
    #         then:
    #           - deep_sleep.enter: deep_sleep_1
  pages:
    - id: setup_page
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        - label:
            x: 0
            y: 80
            width: 240
            text: "Connecting to WiFi"
            text_font: montserrat_14
            text_color: 0xFFFFFF
            align: TOP_MID
            text_align: CENTER
        - label:
            x: 0
            y: 110
            width: 240
            text: "${friendly_name}"
            text_font: montserrat_28
            text_color: 0xFFFFFF
            align: TOP_MID
            text_align: CENTER
        - label:
            x: 0
            y: 220
            width: 240
            text: "If setup is needed, join\n'${friendly_name} Setup' wifi"
            text_font: montserrat_14
            text_color: 0xFFFFFF
            align: TOP_MID
            text_align: CENTER
    - id: main_page
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        - button:
            id: btn_roku_power
            x: 8
            y: 8
            width: 108
            height: 96
            widgets:
              - label:
                  text: "Roku\nPower"
                  align: CENTER
            on_click:
              - homeassistant.service:
                  service: remote.toggle
                  data:
                    entity_id: remote.living_room_tv
        - button:
            id: btn_roku_play_game
            x: 124
            y: 8
            width: 108
            height: 96
            widgets:
              - label:
                  text: "Play\nGame"
                  align: CENTER
            on_click:
              - homeassistant.service:
                  service: remote.send_command
                  data:
                    entity_id: remote.living_room_tv
                    device: cc6a35ae75dc995d71981ff3e2a4a3ae
                    command: input_hdmi1
        - button:
            id: btn_roku_watch_tv
            x: 8
            y: 112
            width: 108
            height: 96
            widgets:
              - label:
                  text: "Watch\nTV"
                  align: CENTER
            on_click:
              - homeassistant.service:
                  service: remote.send_command
                  data:
                    entity_id: remote.living_room_tv
                    device: cc6a35ae75dc995d71981ff3e2a4a3ae
                    command: input_hdmi3
        - button:
            id: btn_window_lamp
            x: 124
            y: 112
            width: 108
            height: 96
            widgets:
              - label:
                  text: "Window\nLamp"
                  align: CENTER
            on_click:
              - homeassistant.service:
                  service: light.toggle
                  data:
                    entity_id: light.media_room_window_lamp_2
        - button:
            id: btn_window_lights
            x: 8
            y: 216
            width: 108
            height: 96
            widgets:
              - label:
                  text: "Window\nLights"
                  align: CENTER
            on_click:
              - homeassistant.service:
                  service: light.toggle
                  data:
                    entity_id: light.window_lights
        - button:
            id: btn_lamp
            x: 124
            y: 216
            width: 108
            height: 96
            widgets:
              - label:
                  text: "Lamp"
                  align: CENTER
            on_click:
              - homeassistant.service:
                  service: switch.toggle
                  data:
                    entity_id: switch.media_room_plug
