# =============================================================================
# DASHBOARD APP LOGIC - board-agnostic
# =============================================================================
# WiFi/API/logger, OTA + auto-update checking (same http_request-manifest
# mechanism as espframe, see apps/espframe/common/addon/firmware_update.yaml),
# and the 6-button LVGL touch UI calling Home Assistant services directly
# over the native API (`homeassistant.service`). Button state (TV power,
# active HDMI input, light on/off) comes back down the same connection via
# `homeassistant` text sensors subscribed to exactly the entities the buttons
# control -- all `internal: true`, so the device still exposes no entities of
# its own to HA. It's a remote with feedback, not a general HA dashboard.
# The only entities it does expose are diagnostics (firmware version, IP
# address), firmware update controls and the Dev Mode switch, also shown in
# the unprotected web portal at http://<device-ip>/ (see web_server below).
#
# Requires a board package to have already defined `tft_display` (display),
# `tft_touch` (touchscreen), `backlight_output` (on/off output),
# `deep_sleep_1` (deep_sleep with a touch wake source), `battery_level`
# (battery % sensor), `usb_host_connected` (binary sensor, on while a PC is
# attached) and a `set_light_sleep_allowed` script taking `allowed: bool` —
# see boards/freenove-s3.yaml.
# =============================================================================

substitutions:
  firmware_version: "dev"
  firmware_manifest_url: "https://rcompton78.github.io/compton-diy/media-room-dashboard/manifest.json"
  # Roku TV entities. remote.* carries power (on/off, "off" in standby);
  # the media_player's `app_id` attribute carries the active input as
  # `tvinput.hdmiN` -- used instead of `source`, which is the user-editable
  # input name and would break if an input got renamed on the TV (both
  # already are: hdmi1 shows as "PlayStation 5", hdmi3 as "Fire TV"). While
  # the TV is off HA drops the `app_id` attribute entirely.
  tv_remote: "remote.living_room_tv"
  tv_media_player: "media_player.living_room_tv"
  tv_game_app_id: "tvinput.hdmi1"
  tv_watch_app_id: "tvinput.hdmi3"
  # COM-214 power tiers (see the README's "Battery power" section):
  #  1. automatic light sleep runs all the time underneath the others (the
  #     board's light_sleep component).
  #  2. after idle_timeout with no touch on main_page, the screen blanks:
  #     backlight off and LVGL paused. WiFi and the HA connection stay up, so
  #     a tap wakes it instantly. That tap only wakes the screen; buttons
  #     respond from the next one.
  #  3. deep_sleep_timeout after the last touch (with wifi connected), deep
  #     sleep. A touch wakes it, but that's a full reboot + reconnect.
  #     While wifi is down, disconnected_sleep_timeout applies instead (the
  #     connecting/setup pages stay lit until then), so a lost network can't
  #     run the battery flat. First-time setup (no saved credentials) never
  #     sleeps.
  # All count from the last touch. For a quick on-device test, override
  # them on the command line instead of editing them here, e.g.
  #   scripts/espframe-esphome.sh -s idle_timeout 20s -s deep_sleep_timeout 30s -s disconnected_sleep_timeout 1min compile ...
  idle_timeout: "30s"
  deep_sleep_timeout: "30min"
  disconnected_sleep_timeout: "5min"
  # COM-446 dev mode (see update_dev_mode): how long the Dev Mode switch
  # keeps the device awake before turning itself off. A PC on USB keeps it
  # awake for as long as it's attached, with no timeout.
  dev_mode_timeout: "1h"
  # Battery % on main_page (COM-446): amber below battery_low_pct, red below
  # battery_critical_pct.
  battery_low_pct: "20"
  battery_critical_pct: "10"

esphome:
  project:
    name: "compton-diy.media-room-dashboard"
    version: "${firmware_version}"
  includes:
    - ../common/ap_clients.h
  # Start the sleep clock at boot: if wifi never connects, on_connect and
  # on_disconnect never fire to start it.
  on_boot:
    - priority: -200
      then:
        - script.execute: restart_sleep_timer

# No compile-time ssid/password: this device relies entirely on the
# captive-portal flow below to get station wifi credentials at runtime
# (submitted once via the fallback AP, then persisted to the ESP32's NVS
# flash partition — separate from the OTA app partition, so it survives
# firmware updates without needing to be baked into every build). Same
# mechanism as apps/espframe's factory image (apps/espframe/builds/
# freenove-s3.yaml).
wifi:
  # Skips the AP scan on connect, going straight for the BSSID+channel saved
  # from the last successful connection (persisted to NVS, survives
  # reboots) -- shaves a meaningful chunk off the deep-sleep wake reconnect
  # (COM-214 tier 3), which is a full ESP32 reboot each time. Falls back
  # to a normal scan if the saved AP can't be reached (e.g. router reboot
  # changed channel), so this doesn't add a new failure mode.
  fast_connect: true
  # No AP password: it's a short, physically-supervised setup window, and an
  # open network is one less thing to type on a phone.
  ap:
    ssid: "${friendly_name} Setup"
  # Switches which LVGL page is shown -- without this, the setup AP exists
  # and works but nothing on the device's own screen tells you it's there
  # (you'd only find it by checking a phone's wifi list), and the 6 buttons
  # would sit there doing nothing useful before HA is even reachable.
  #
  # on_connect/on_disconnect only fire on a real connected<->disconnected
  # edge, not on each failed retry, so neither of them can tell "still
  # retrying the saved network" from "gave up, fallback AP is up". The
  # interval below watches for the latter (`wifi.ap_active`) and swaps in
  # setup_page once. These handlers reset its one-shot guard so a later
  # drop -> AP cycle shows setup_page again.
  on_connect:
    - globals.set:
        id: setup_page_shown
        value: "false"
    - lvgl.page.show: main_page
    # Restart LVGL's inactivity clock: on_idle may already have fired (and
    # been skipped) on connecting_page, and it won't fire again until the
    # clock restarts, so main_page would otherwise never blank.
    - lambda: 'lv_display_trigger_activity(nullptr);'
    # Switch to the connected sleep clock; touches restart it from here on.
    - script.execute: restart_sleep_timer
  on_disconnect:
    - globals.set:
        id: setup_page_shown
        value: "false"
    # Only main_page ever blanks; make sure a status page is visible.
    - script.execute: wake_screen
    # Switch to the (shorter) disconnected sleep clock.
    - script.execute: restart_sleep_timer
    # Never leave a stale address in the footer; the ip_address sensor
    # repaints it on the next connect.
    - lvgl.label.update:
        id: lbl_ip_footer
        text: ""
    - lvgl.page.show: connecting_page

globals:
  - id: setup_page_shown
    type: bool
    initial_value: "false"
  # True while the screen is blanked (COM-214 tier 2), see blank_screen.
  - id: screen_dark
    type: bool
    initial_value: "false"
  # True while dev mode is on (COM-446), see update_dev_mode.
  - id: dev_mode
    type: bool
    initial_value: "false"

# Moves from connecting_page to setup_page once the fallback AP is actually
# up. (An earlier attempt at this split seemed to hang the device, but that
# turned out to be the display init bug fixed in boards/freenove-s3.yaml --
# see COM-213 -- not anything about switching pages while the AP runs.)
interval:
  - interval: 1s
    then:
      - if:
          condition:
            and:
              - wifi.ap_active:
              - lambda: 'return !id(setup_page_shown);'
          then:
            - globals.set:
                id: setup_page_shown
                value: "true"
            - script.execute: wake_screen
            - lvgl.page.show: setup_page
      # Someone joined to the fallback AP is re-entering wifi details from a
      # phone, so nothing touches this screen: keep restarting the offline
      # deep-sleep countdown while they're connected (COM-214).
      - if:
          condition:
            and:
              - wifi.ap_active:
              - lambda: 'return fallback_ap_has_clients();'
          then:
            - script.execute: restart_sleep_timer

captive_portal:

# -----------------------------------------------------------------------------
# Admin portal: ESPHome's stock web UI at http://<device-ip>/ (the address
# the main page footer shows). It lists the diagnostic entities (IP,
# firmware version), the Firmware Update entity and its Check/Install
# buttons (see `button:` below), and `ota: platform: web_server` adds an upload form
# for flashing a local build without USB. `local: true` embeds the UI's
# JS/CSS in the firmware instead of loading it from oi.esphome.io, so it also
# works from a phone on the setup AP with no internet.
#
# Deliberately unprotected, same as cyd-clock's and espframe's portals:
# anyone on the LAN -- or on the open setup AP while it's up -- can flash the
# device. captive_portal keeps working alongside it: it only claims requests
# while the fallback AP is active, so the wifi setup form never needs a login
# either way.
# -----------------------------------------------------------------------------
web_server:
  port: 80
  version: 3
  local: true

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key
  # No reboot when HA stays away. The default 15min would reboot a device
  # that's on wifi but can't reach HA every 15 minutes, so it never reached
  # the 30min deep sleep (COM-214). Deep sleep's reboot-on-wake retries the
  # connection anyway. (wifi's own reboot_timeout never applies here: ESPHome
  # skips it when a fallback AP is configured.)
  reboot_timeout: 0s
  # Once HA is gone the imported states below are frozen at whatever they
  # last were, so drop every button back to neutral rather than show state
  # that may no longer be true. HA re-sends every subscribed state when it
  # reconnects, which repaints them. Only reset when no state-subscribed
  # client remains, so an `esphome logs` session disconnecting doesn't
  # blank the buttons while HA is still connected.
  on_client_disconnected:
    - if:
        condition:
          not:
            api.connected:
              state_subscription_only: true
        then:
          - script.execute: reset_button_states

# -----------------------------------------------------------------------------
# OTA + auto-update check against the GitHub Pages manifest (see CLAUDE.md's
# "Release workflow" section — dist/media-room-dashboard/manifest.json).
# -----------------------------------------------------------------------------
http_request:

ota:
  - platform: http_request
  # Upload form in the web portal above.
  - platform: web_server
  # `esphome upload --device <ip>` from a laptop, same as espframe's devices.
  - platform: esphome

update:
  - platform: http_request
    id: firmware_update
    name: "Firmware Update"
    source: ${firmware_manifest_url}
    update_interval: 6h
    # No install here. The check runs on every boot, and since COM-214's deep
    # sleep every touch wake is a boot, so installing here would tie the
    # remote up (download, flash, reboot) right when someone picks it up.
    # deep_sleep_countdown installs it instead, once the device has sat idle
    # for deep_sleep_timeout, in place of that deep sleep.
    #
    # Auto-install also skips unversioned "dev" builds: firmware_version is
    # never substituted with the real RELEASE_VERSION at build time
    # (generate_release.py's --version only feeds manifest.json, not the
    # compiled binary), so every "dev" build always mismatches the published
    # manifest version and would otherwise auto-install on every boot
    # forever, including a fresh install right after the one that just ran
    # (since the OTA'd binary is also always "dev"). Matches
    # libs/ota-update-client's existing currentVersion=="dev" skip for the
    # same reason.

# Manual check/install from the web portal. The stock web_server v3 UI shows
# the update entity's state but has no install control for it (HA's own
# update card does), so these buttons are the portal's way to act on an
# "UPDATE AVAILABLE" without waiting for the next check. Install is a
# deliberate press, so unlike the idle auto-install in deep_sleep_countdown
# it runs immediately and isn't skipped on "dev" builds -- pressing it on a
# local build replaces it with the published release.
button:
  - platform: template
    name: "Check for Firmware Update"
    icon: "mdi:update"
    entity_category: config
    on_press:
      - component.update: firmware_update
  - platform: template
    name: "Install Firmware Update"
    icon: "mdi:download"
    entity_category: config
    on_press:
      - update.perform: firmware_update

text_sensor:
  - platform: template
    name: "Firmware Version"
    entity_category: diagnostic
    # Not `never`: a template sensor with no interval never publishes at all,
    # so this showed blank in HA and the web portal. The value is a
    # compile-time constant, so an hourly re-publish costs nothing.
    update_interval: 1h
    lambda: 'return {"${firmware_version}"};'

  # Current station IP, shown on-screen (main page footer / connecting page)
  # so the device and its web portal can be found without the router or HA.
  # Only reports the station address -- in fallback AP mode the device is at
  # 192.168.4.1, which setup_page states instead.
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
      on_value:
        - if:
            condition:
              lambda: 'return !x.empty() && x != "0.0.0.0";'
            then:
              - lvgl.label.update:
                  id: lbl_ip_footer
                  text: !lambda 'return "http://" + x;'
              - lvgl.label.update:
                  id: lbl_connecting_ip
                  text: !lambda 'return "Not connected\nLast IP: " + x;'

  # ---------------------------------------------------------------------------
  # Button state imported from HA. Text sensors rather than `homeassistant`
  # binary sensors so "unavailable"/"unknown" are visible as their own
  # values instead of collapsing into off. None of these need the "Allow the
  # device to perform Home Assistant actions" toggle -- HA pushes subscribed
  # states to any paired device. The buttons are deliberately not
  # `checkable`, so a tap never flips the highlight by itself: it only
  # changes once HA confirms the new state.
  # ---------------------------------------------------------------------------
  - platform: homeassistant
    id: tv_power
    entity_id: ${tv_remote}
    internal: true
    on_value:
      # Label names the action a tap performs; the checked (lit) style shows
      # the current state. Anything other than on/off (unavailable, unknown)
      # falls back to the neutral pre-feedback label.
      - lvgl.label.update:
          id: lbl_roku_power
          text: !lambda 'return std::string(x == "on" ? "Power\nOff" : (x == "off" ? "Power\nOn" : "Roku\nPower"));'
      - lvgl.widget.update:
          id: btn_roku_power
          state:
            checked: !lambda 'return x == "on";'
      - script.execute: refresh_input_buttons

  - platform: homeassistant
    id: tv_app_id
    entity_id: ${tv_media_player}
    attribute: app_id
    internal: true
    on_value:
      - script.execute: refresh_input_buttons

  - platform: homeassistant
    id: window_lamp_state
    entity_id: light.media_room_window_lamp_2
    internal: true
    on_value:
      - lvgl.widget.update:
          id: btn_window_lamp
          state:
            checked: !lambda 'return x == "on";'

  - platform: homeassistant
    id: window_lights_state
    entity_id: light.window_lights
    internal: true
    on_value:
      - lvgl.widget.update:
          id: btn_window_lights
          state:
            checked: !lambda 'return x == "on";'

  - platform: homeassistant
    id: standing_lamp_state
    entity_id: switch.media_room_plug
    internal: true
    on_value:
      - lvgl.widget.update:
          id: btn_standing_lamp
          state:
            checked: !lambda 'return x == "on";'

# Battery % in the main_page footer (COM-446). Driven only by the board's
# existing battery_level reading, so no extra ADC reads or wakeups.
sensor:
  - id: !extend battery_level
    on_value:
      - script.execute: refresh_battery_label

# COM-446 dev mode trigger #1: a PC on USB (see the board's
# usb_host_connected). A charger never turns it on.
binary_sensor:
  - id: !extend usb_host_connected
    on_state:
      - script.execute: update_dev_mode
      # The footer shows a USB glyph instead of the battery one while a PC
      # is attached.
      - script.execute: refresh_battery_label

# COM-446 dev mode trigger #2: forced on from HA or the web portal, for an
# OTA or log session over wifi with no USB attached. Off at every boot (never
# restored, so a forgotten switch can't keep a battery remote awake past a
# reboot) and off again by itself after dev_mode_timeout.
switch:
  - platform: template
    id: dev_mode_switch
    name: "Dev Mode"
    icon: "mdi:developer-board"
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - script.execute: dev_mode_auto_off
      - script.execute: update_dev_mode
    on_turn_off:
      - script.stop: dev_mode_auto_off
      - script.execute: update_dev_mode

script:
  # The Roku can keep reporting its last input's app_id while in standby, so
  # the input buttons are gated on power as well -- re-run whenever either
  # changes.
  - id: refresh_input_buttons
    then:
      - lvgl.widget.update:
          id: btn_roku_play_game
          state:
            checked: !lambda 'return id(tv_power).state == "on" && id(tv_app_id).state == "${tv_game_app_id}";'
      - lvgl.widget.update:
          id: btn_roku_watch_tv
          state:
            checked: !lambda 'return id(tv_power).state == "on" && id(tv_app_id).state == "${tv_watch_app_id}";'

  - id: reset_button_states
    then:
      - lvgl.label.update:
          id: lbl_roku_power
          text: "Roku\nPower"
      - lvgl.widget.update:
          id: [btn_roku_power, btn_roku_play_game, btn_roku_watch_tv, btn_window_lamp, btn_window_lights, btn_standing_lamp]
          state:
            checked: false

  # COM-214 tier 2: blank the screen. Pausing LVGL (with resume_on_input
  # off, see lvgl: below) stops it reading touch at all, so the touch that
  # wakes the screen never reaches a button. Pausing also stops LVGL's idle
  # callbacks, so the deep-sleep tier runs off its own countdown (restarted
  # by every touch) instead of a second on_idle timeout.
  - id: blank_screen
    then:
      - globals.set:
          id: screen_dark
          value: "true"
      - output.turn_off: backlight_output
      - lvgl.pause:

  # Undo blank_screen. lvgl.resume also restarts LVGL's inactivity clock, so
  # the screen doesn't blank again straight away.
  - id: wake_screen
    then:
      - if:
          condition:
            lambda: 'return id(screen_dark);'
          then:
            - globals.set:
                id: screen_dark
                value: "false"
            - lvgl.resume:
            - output.turn_on: backlight_output

  # COM-214 tier 3's clock. Run at boot, on every wifi connect/disconnect
  # and on every touch release: starts whichever countdown matches the wifi
  # state and stops the other, so both count from the last touch. In dev
  # mode it stops both instead.
  - id: restart_sleep_timer
    then:
      - if:
          condition:
            lambda: 'return id(dev_mode);'
          then:
            - script.stop: deep_sleep_countdown
            - script.stop: offline_sleep_countdown
          else:
            - if:
                condition:
                  wifi.connected:
                then:
                  - script.stop: offline_sleep_countdown
                  - script.execute: deep_sleep_countdown
                else:
                  - script.stop: deep_sleep_countdown
                  - script.execute: offline_sleep_countdown

  # COM-446 dev mode: on while a PC is on USB or the Dev Mode switch is on.
  # While on, the screen never blanks (on_idle skips it), neither deep-sleep
  # countdown runs (restart_sleep_timer stops them, and both re-check before
  # sleeping), and automatic light sleep is blocked, so serial logs, USB
  # flashing and OTA keep working. The footer shows a DEV badge. Turning off
  # restarts the blank and deep-sleep clocks from that moment, as if the
  # screen had just been touched. Re-run on every change to either trigger;
  # it only acts when the combined state flips.
  - id: update_dev_mode
    then:
      - if:
          condition:
            lambda: 'return (id(usb_host_connected).state || id(dev_mode_switch).state) != id(dev_mode);'
          then:
            - globals.set:
                id: dev_mode
                value: !lambda 'return !id(dev_mode);'
            - if:
                condition:
                  lambda: 'return id(dev_mode);'
                then:
                  - logger.log:
                      format: "Dev mode on: no screen blank or sleep"
                      level: INFO
                  - script.execute:
                      id: set_light_sleep_allowed
                      allowed: false
                  - lvgl.widget.show: lbl_dev_badge
                  - script.execute: wake_screen
                  - script.execute: restart_sleep_timer
                else:
                  - logger.log:
                      format: "Dev mode off: normal sleep timers restart now"
                      level: INFO
                  - script.execute:
                      id: set_light_sleep_allowed
                      allowed: true
                  - lvgl.widget.hide: lbl_dev_badge
                  # Restart LVGL's inactivity clock: on_idle already fired
                  # (and was skipped) during dev mode, and won't fire again
                  # until the clock restarts.
                  - lambda: 'lv_display_trigger_activity(nullptr);'
                  - script.execute: restart_sleep_timer

  - id: dev_mode_auto_off
    mode: restart
    then:
      - delay: ${dev_mode_timeout}
      - logger.log:
          format: "Dev Mode switch timed out"
          level: INFO
      - switch.turn_off: dev_mode_switch

  # Footer battery readout: a battery glyph stepped by charge plus the %, in
  # amber below battery_low_pct and red below battery_critical_pct. While a PC
  # is attached the glyph is a USB plug and the colour stays grey: the battery
  # is charging then and reads near its 4.2V charge voltage, so the % isn't a
  # real charge level. A wall charger can't be detected (the BQ25185 exposes
  # no power-good/charge pin), so it shows the normal readout.
  - id: refresh_battery_label
    then:
      - lambda: |-
          float pct = id(battery_level).state;
          bool usb = id(usb_host_connected).state;
          int rounded = std::isnan(pct) ? -1 : (int) roundf(pct);
          const char *glyph = LV_SYMBOL_BATTERY_EMPTY;
          if (usb) glyph = LV_SYMBOL_USB;
          else if (rounded >= 85) glyph = LV_SYMBOL_BATTERY_FULL;
          else if (rounded >= 60) glyph = LV_SYMBOL_BATTERY_3;
          else if (rounded >= 35) glyph = LV_SYMBOL_BATTERY_2;
          else if (rounded >= ${battery_critical_pct}) glyph = LV_SYMBOL_BATTERY_1;
          uint32_t color = 0x909090;
          if (!usb && rounded >= 0) {
            if (rounded < ${battery_critical_pct}) color = 0xE5484D;
            else if (rounded < ${battery_low_pct}) color = 0xF5A623;
          }
          char buf[24];
          if (rounded < 0)
            snprintf(buf, sizeof(buf), "%s --%%", glyph);
          else
            snprintf(buf, sizeof(buf), "%s %d%%", glyph, rounded);
          lv_label_set_text(id(lbl_battery), buf);
          lv_obj_set_style_text_color(id(lbl_battery), lv_color_hex(color), LV_PART_MAIN);

  # COM-214 tier 3 while wifi is down: deep sleep after
  # disconnected_sleep_timeout untouched, so an unreachable network (router
  # off, out of range) can't run the battery flat; the next touch wake
  # retries wifi from scratch. ESPHome raises the fallback AP 90s after any
  # failed connect, even with saved credentials, so the AP being up doesn't
  # mean setup is happening. Only a device with no saved credentials (first
  # -time setup, where the activity is on a phone, not this screen) stays
  # awake, plus any time a phone is joined to the AP (see the AP interval).
  - id: offline_sleep_countdown
    mode: restart
    then:
      - delay: ${disconnected_sleep_timeout}
      - if:
          condition:
            and:
              - not:
                  wifi.connected:
              - lambda: 'return wifi::global_wifi_component->has_sta();'
              - lambda: 'return !id(dev_mode);'
          then:
            - logger.log:
                format: "Offline and idle: entering deep sleep"
                level: INFO
            - deep_sleep.enter: deep_sleep_1

  # COM-214 tier 3: deep sleep deep_sleep_timeout after the last touch while
  # connected (see restart_sleep_timer). deep_sleep_1 itself waits while the
  # touch INT line is low.
  #
  # If a firmware update is available (versioned builds only, see the update
  # entity), install it here instead of sleeping: the device has been idle
  # for deep_sleep_timeout, so nobody is waiting on it. A successful install
  # reboots before the delay below ends. If it fails, the update is still
  # "available" and the next idle stretch retries; this one sleeps anyway.
  - id: deep_sleep_countdown
    mode: restart
    then:
      - delay: ${deep_sleep_timeout}
      - if:
          condition:
            and:
              - wifi.connected:
              - lambda: 'return !id(dev_mode);'
          then:
            - if:
                condition:
                  and:
                    - update.is_available: firmware_update
                    - lambda: 'return strcmp("${firmware_version}", "dev") != 0;'
                then:
                  - logger.log:
                      format: "Idle: installing firmware update instead of deep sleep"
                      level: INFO
                  - update.perform: firmware_update
                  # flash() blocks the main loop and reboots on success, so
                  # this only finishes after a failed install.
                  - delay: 5s
                  - logger.log:
                      format: "Idle: firmware update failed, entering deep sleep"
                      level: WARN
            - logger.log:
                format: "Idle: entering deep sleep"
                level: INFO
            - deep_sleep.enter: deep_sleep_1

# Wake from tier 2 on release rather than on touch: LVGL is still paused
# while the finger is down, so the whole waking tap is swallowed. The
# deep-sleep countdowns stop while a finger is down and restart from the
# release.
touchscreen:
  - id: !extend tft_touch
    on_touch:
      - script.stop: deep_sleep_countdown
      - script.stop: offline_sleep_countdown
    on_release:
      - script.execute: wake_screen
      - script.execute: restart_sleep_timer

# -----------------------------------------------------------------------------
# Three LVGL pages. `connecting_page` (the default, i.e. at boot, and again
# whenever wifi drops) says the device is retrying its saved network;
# `setup_page` replaces it once that fails and the fallback AP comes up (see
# the interval above), naming the AP to join; `main_page` -- the 6-button
# dashboard, hidden until the device is actually reachable from HA -- is a 2
# column x 3 row grid over the 240x320 portrait panel (this board's native,
# already-confirmed-working orientation, no rotation transform), with a
# one-line footer under it showing the web portal's http://<ip> address.
# Button -> HA service mapping is the finalized list from Jira DIY-102. Every
# button shares one theme: dim grey by default, lit amber when `checked` --
# which only the imported HA state above ever sets.
# -----------------------------------------------------------------------------
# byte_order: big_endian avoids a known LVGL+ili9xxx grey-screen bug hit on
# this same panel in apps/espframe (see project memory project_diy44_espframe
# — little_endian was copied verbatim from a different, mipi_dsi-based board
# and never validated against this SPI panel).
lvgl:
  displays: [tft_display]
  touchscreens: [tft_touch]
  byte_order: big_endian
  theme:
    button:
      bg_color: 0x303030
      text_color: 0xFFFFFF
      checked:
        bg_color: 0xF5A623
        text_color: 0x000000
  # The wake touch is handled by wake_screen, not LVGL (see blank_screen).
  resume_on_input: false
  # Tier 2: blank only on main_page. The connecting and setup pages stay lit
  # so their wifi instructions stay readable. Never in dev mode.
  on_idle:
    - timeout: ${idle_timeout}
      then:
        - if:
            condition:
              lambda: 'return id(main_page)->is_showing() && !id(dev_mode);'
            then:
              - script.execute: blank_screen
  pages:
    - id: connecting_page
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        - label:
            x: 0
            y: 80
            width: 240
            text: "Connecting to WiFi"
            text_font: montserrat_14
            text_color: 0xFFFFFF
            align: TOP_MID
            text_align: CENTER
        - label:
            x: 0
            y: 110
            width: 240
            text: "${friendly_name}"
            text_font: montserrat_28
            text_color: 0xFFFFFF
            align: TOP_MID
            text_align: CENTER
        # Updated by the ip_address sensor to include the last address, so a
        # device that dropped off wifi still tells you where it was.
        - label:
            id: lbl_connecting_ip
            x: 0
            y: 240
            width: 240
            text: "Not connected"
            text_font: montserrat_14
            text_color: 0x909090
            align: TOP_MID
            text_align: CENTER
    - id: setup_page
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        - label:
            x: 0
            y: 80
            width: 240
            text: "Connect to WiFi"
            text_font: montserrat_14
            text_color: 0xFFFFFF
            align: TOP_MID
            text_align: CENTER
        - label:
            x: 0
            y: 110
            width: 240
            text: "'${friendly_name} Setup'"
            text_font: montserrat_28
            text_color: 0xFFFFFF
            align: TOP_MID
            text_align: CENTER
        - label:
            x: 0
            y: 240
            width: 240
            text: "Join it from a phone to\nenter your wifi details"
            text_font: montserrat_14
            text_color: 0xFFFFFF
            align: TOP_MID
            text_align: CENTER
        # For phones that don't pop the captive portal up by themselves.
        # 192.168.4.1 is ESPHome's default fallback AP address.
        - label:
            x: 0
            y: 280
            width: 240
            text: "Then open http://192.168.4.1"
            text_font: montserrat_14
            text_color: 0x909090
            align: TOP_MID
            text_align: CENTER
    - id: main_page
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        - button:
            id: btn_roku_power
            x: 8
            y: 8
            width: 108
            height: 88
            widgets:
              - label:
                  id: lbl_roku_power
                  text: "Roku\nPower"
                  align: CENTER
            on_click:
              - homeassistant.service:
                  service: remote.toggle
                  data:
                    entity_id: ${tv_remote}
        - button:
            id: btn_roku_play_game
            x: 124
            y: 8
            width: 108
            height: 88
            widgets:
              - label:
                  text: "Play\nGame"
                  align: CENTER
            on_click:
              - homeassistant.service:
                  service: remote.send_command
                  data:
                    entity_id: ${tv_remote}
                    device: cc6a35ae75dc995d71981ff3e2a4a3ae
                    command: input_hdmi1
        - button:
            id: btn_roku_watch_tv
            x: 8
            y: 104
            width: 108
            height: 88
            widgets:
              - label:
                  text: "Watch\nTV"
                  align: CENTER
            on_click:
              - homeassistant.service:
                  service: remote.send_command
                  data:
                    entity_id: ${tv_remote}
                    device: cc6a35ae75dc995d71981ff3e2a4a3ae
                    command: input_hdmi3
        - button:
            id: btn_window_lamp
            x: 124
            y: 104
            width: 108
            height: 88
            widgets:
              - label:
                  text: "Window\nLamp"
                  align: CENTER
            on_click:
              - homeassistant.service:
                  service: light.toggle
                  data:
                    entity_id: light.media_room_window_lamp_2
        - button:
            id: btn_window_lights
            x: 8
            y: 200
            width: 108
            height: 88
            widgets:
              - label:
                  text: "Window\nLights"
                  align: CENTER
            on_click:
              - homeassistant.service:
                  service: light.toggle
                  data:
                    entity_id: light.window_lights
        - button:
            id: btn_standing_lamp
            x: 124
            y: 200
            width: 108
            height: 88
            widgets:
              - label:
                  text: "Standing\nLamp"
                  align: CENTER
            on_click:
              - homeassistant.service:
                  service: switch.toggle
                  data:
                    entity_id: switch.media_room_plug
        # Footer under the 3 button rows, laid out as a flex row so the
        # pieces share the 232px however long the address is: the web portal
        # address on the left (filled in by the ip_address sensor, cleared by
        # wifi on_disconnect; truncated with "..." only if it would overlap),
        # the DEV badge while dev mode is on, and the battery readout on the
        # right (refresh_battery_label). The DEV badge is hidden, and so
        # left out of the layout, the rest of the time.
        - obj:
            id: footer_row
            x: 4
            y: 294
            width: 232
            height: 22
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            layout:
              type: flex
              pad_column: 6
              flex_flow: ROW
              flex_align_main: START
              flex_align_cross: CENTER
              flex_align_track: CENTER
            widgets:
              - label:
                  id: lbl_ip_footer
                  flex_grow: 1
                  long_mode: DOT
                  text: ""
                  text_font: montserrat_14
                  text_color: 0x909090
              - label:
                  id: lbl_dev_badge
                  hidden: true
                  text: "DEV"
                  text_font: montserrat_14
                  text_color: 0x000000
                  bg_color: 0xF5A623
                  bg_opa: COVER
                  radius: 3
                  pad_left: 4
                  pad_right: 4
              - label:
                  id: lbl_battery
                  text: "\uF244 --%"
                  text_font: montserrat_14
                  text_color: 0x909090
