# =============================================================================
# BOARD HAL: Freenove ESP32-S3 CYD (2.8" ILI9341 + FT6336U capacitive touch)
# =============================================================================
# Hardware-only ESPHome package: chip, PSRAM, backlight, SPI display, I2C
# touch. No app logic (no wifi/api/ota/UI) lives here on purpose.
#
# To port this app to a different board (e.g. the AliExpress 2.8" board this
# card was originally targeting, see docs/diy-102-bringup/HANDOFF.md), add a
# new file here — `boards/<name>.yaml` — that provides the same component
# ids this file provides (`tft_display`, `tft_touch`, `backlight_output`) and
# point a new `builds/<name>.yaml` at it instead of this file. Nothing in
# common/dashboard.yaml needs to change.
#
# Display pins and the ILI9341 init sequence are copied from apps/espframe's
# freenove-s3 device (same physical board), which confirmed this exact
# alternate init sequence is required — ESPHome's stock `ili9xxx` "ILI9341"
# model leaves this panel blank white. See
# apps/espframe/builds/.esphome/external_components/*/devices/freenove-s3/
# device/device.yaml for the source of truth this was copied from, and
# https://github.com/Bodmer/TFT_eSPI/issues/1172 for background on why the
# alternate sequence is needed.
#
# Touch pins: SDA=GPIO16, SCL=GPIO15, RST=GPIO18, INT=GPIO17. These are the
# same pins apps/cyd-clock ships for this exact board (see its
# include/Config.h under BOARD_FREENOVE_S3) and are confirmed working there
# on this physical unit -- so the pins were never the problem. The actual
# root cause: ESPHome's ft63x6 component toggles the reset pin and reads the
# chip-id register only 10ms later (hard_reset_() in ft63x6.cpp), but the
# FT6336U needs much longer than that to come back up after reset --
# cyd-clock's own driver (libs/touch-driver, wrapping
# https://github.com/aselectroworks/Arduino-FT6336U) waits a full 500ms
# after toggling reset before doing anything on the bus. ESPHome's component
# has no config knob for that delay, so instead the reset_pin is left
# unset here entirely -- skipping ESPHome's too-fast reset toggle lets the
# chip's own power-on boot (which has had ~1s by the time this component's
# setup() runs) stand in for it. interrupt_pin is also left unset (polling
# mode) since it's optional and this isolates the fix to the one thing that
# was actually broken.
#
# GPIO17 (touch INT) doubles as a wake source for two of COM-214's
# battery-power prototypes below -- independent of the interrupt_pin/polling
# decision above: both wake mechanisms are raw hardware-level pin watches,
# unrelated to whether ESPHome's touchscreen driver is using this pin for
# interrupt-driven reads. They work because the FT6336U's INT pin still
# pulses low on every touch (~1ms pulses while held) whenever the chip's
# G_MODE register (0xA4) is in "trigger" mode, regardless of ESPHome's
# interrupt_pin setting -- see the on_boot lambda below, which writes that
# register explicitly rather than relying on it defaulting to trigger mode
# out of reset (true for this chip family per its datasheet, but not worth
# depending on across chip revisions/batches).
#
# backlight_output is a plain gpio output (on/off only), not ledc/PWM, even
# though it's never dimmed to anything but 0%/100% either way -- this
# matters for COM-214 option 3 (see components/light_sleep/): light sleep
# clock-gates APB, which stops LEDC's PWM waveform generation entirely and
# showed up as the backlight visibly flickering in testing. A static GPIO
# level doesn't need a running clock to hold its state, so it isn't affected.
# =============================================================================

esp32:
  variant: ESP32S3
  flash_size: 16MB
  # 160MHz (down from the board's default 240MHz) plus the sdkconfig options
  # below are ESP-IDF's own documented reference config for automatic light
  # sleep (COM-214 option 3, see components/light_sleep/) --
  # https://docs.espressif.com/projects/esp-idf/en/stable/esp32s3/api-guides/low-power-mode/low-power-mode-wifi.html
  # CONFIG_USJ_NO_AUTO_LS_ON_CONNECTION keeps the native USB-Serial/JTAG
  # console usable while a host is attached (light sleep otherwise gates the
  # USB PHY clock too and drops the serial connection on every sleep cycle,
  # per https://docs.espressif.com/projects/esp-idf/en/stable/esp32s3/api-guides/usb-serial-jtag-console.html)
  # -- dev/debugging aid only, irrelevant once running standalone on battery
  # with nothing plugged into USB.
  cpu_frequency: 160MHZ
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_PM_ENABLE: "y"
      CONFIG_FREERTOS_USE_TICKLESS_IDLE: "y"
      CONFIG_USJ_NO_AUTO_LS_ON_CONNECTION: "y"

psram:
  mode: octal
  speed: 80MHz

esphome:
  on_boot:
    - priority: -100
      then:
        - output.turn_on: backlight_output
        - lambda: |-
            id(tft_touch).write_byte(0xA4, 0x01);  // G_MODE = trigger, see note above

# Idle-timeout deep sleep (COM-214 option 1, currently dormant as a tier --
# see common/dashboard.yaml). No sleep_duration/run_duration is set here --
# deep_sleep.enter is called explicitly by app logic, never on a timer of
# its own.
#
# Deliberately NO esp32_ext1_wakeup config here (removed after on-device
# testing showed repeated spurious wakes within seconds of entering deep
# sleep, once light_sleep's own gpio_wakeup_enable/esp_sleep_enable_gpio_wakeup
# was also active on the same GPIO17). ESP-IDF documents
# esp_sleep_enable_gpio_wakeup() and esp_sleep_enable_ext1_wakeup() as
# alternatives, not something meant to run together on one pin --
# https://docs.espressif.com/projects/esp-idf/en/stable/esp32s3/api-reference/system/sleep_modes.html.
# deep_sleep_1 now relies entirely on the GPIO wake source light_sleep
# already registers at boot (valid for deep sleep too on an RTC-capable pin
# like GPIO17, confirmed in the same doc) -- esp_deep_sleep_start() just
# uses whatever wake sources are currently enabled, so deep_sleep_1 doesn't
# need to configure its own.
deep_sleep:
  id: deep_sleep_1

# COM-214 option 3: automatic light sleep, additive to option 2's
# backlight-off-on-idle logic in common/dashboard.yaml (not a replacement --
# that logic still turns the backlight off/on; this separately lets the
# CPU/WiFi themselves drop into low-power light sleep during idle gaps,
# something backlight control alone can't do). See
# components/light_sleep/light_sleep_component.h for what this does and its
# current caveats -- first attempt flickered the backlight and dropped the
# USB serial connection, both addressed above (gpio backlight output,
# CONFIG_USJ_NO_AUTO_LS_ON_CONNECTION).
external_components:
  - source:
      type: local
      path: ../components
    components: [light_sleep]

light_sleep:
  wakeup_pin: 17

# Battery voltage/percentage (COM-214): this exact board (Freenove ESP32-S3
# CYD 2.8", product fnk0104) has a built-in BAT JST connector wired through a
# factory 2:1 voltage divider into GPIO9, scaling the battery's up-to-4.2V
# range down to a safe 0-2.1V for the ADC -- confirmed via Freenove's own docs
# for this board: https://docs.freenove.com/projects/fnk0104/en/latest/fnk0104/codes/MAIN/5_Battery_Voltage.html
# (their own example reads raw millivolts and multiplies by 2.0 to undo the
# divider, matched here via the `multiply: 2.0` filter). The percentage below
# is a standard 1S LiPo discharge-curve approximation (calibrate_linear) --
# it isn't calibrated to any specific cell and will drift under load or at
# temperature extremes; a real fuel-gauge IC (e.g. MAX17048) would be
# meaningfully more accurate if this needs to be trustworthy rather than
# roughly-indicative.
sensor:
  - platform: adc
    pin: GPIO9
    id: battery_voltage
    name: "Battery Voltage"
    entity_category: diagnostic
    device_class: voltage
    unit_of_measurement: "V"
    accuracy_decimals: 2
    update_interval: 60s
    attenuation: 12db
    filters:
      - multiply: 2.0
  - platform: copy
    source_id: battery_voltage
    name: "Battery Level"
    id: battery_level
    entity_category: diagnostic
    device_class: battery
    unit_of_measurement: "%"
    accuracy_decimals: 0
    filters:
      - calibrate_linear:
          - 3.30 -> 0.0
          - 3.50 -> 10.0
          - 3.66 -> 25.0
          - 3.79 -> 45.0
          - 3.87 -> 60.0
          - 3.95 -> 72.0
          - 4.02 -> 82.0
          - 4.11 -> 92.0
          - 4.20 -> 100.0
      - clamp:
          min_value: 0.0
          max_value: 100.0

output:
  - platform: gpio
    id: backlight_output
    pin: GPIO45

spi:
  id: spi_bus_display
  clk_pin: GPIO12
  mosi_pin: GPIO11
  miso_pin: GPIO13

i2c:
  - id: i2c_bus_touch
    sda: GPIO16
    scl: GPIO15
    frequency: 400kHz

# BGR order, inverted colors, and the alternate init sequence below all match
# the working freenove-s3 config in apps/espframe — this is the same panel.
display:
  - platform: ili9xxx
    model: CUSTOM
    id: tft_display
    spi_id: spi_bus_display
    cs_pin: GPIO10
    dc_pin: GPIO46
    color_order: BGR
    invert_colors: true
    auto_clear_enabled: false
    update_interval: never
    transform:
      mirror_x: true
    dimensions:
      width: 240
      height: 320
    init_sequence:
      - [0xCF, 0x00, 0xC1, 0x30]
      - [0xED, 0x64, 0x03, 0x12, 0x81]
      - [0xE8, 0x85, 0x00, 0x78]
      - [0xCB, 0x39, 0x2C, 0x00, 0x34, 0x02]
      - [0xF7, 0x20]
      - [0xEA, 0x00, 0x00]
      - [0xC0, 0x10]                                                                       # PWCTR1
      - [0xC1, 0x00]                                                                       # PWCTR2
      - [0xC5, 0x30, 0x30]                                                                 # VMCTR1
      - [0xC7, 0xB7]                                                                       # VMCTR2
      - [0x3A, 0x55]                                                                       # PIXFMT (16bpp)
      - [0x36, 0x08]                                                                       # MADCTL (BGR, no rotation)
      - [0xB1, 0x00, 0x1A]                                                                 # FRMCTR1
      - [0xB6, 0x08, 0x82, 0x27]                                                           # DFUNCTR
      - [0xF2, 0x00]                                                                       # 3Gamma disable
      - [0x26, 0x01]                                                                       # GAMMASET
      - [0xE0, 0x0F, 0x2A, 0x28, 0x08, 0x0E, 0x08, 0x54, 0xA9, 0x43, 0x0A, 0x0F, 0x00, 0x00, 0x00, 0x00]  # GMCTRP1
      - [0xE1, 0x00, 0x15, 0x17, 0x07, 0x11, 0x06, 0x2B, 0x56, 0x3C, 0x05, 0x10, 0x0F, 0x3F, 0x3F, 0x0F]  # GMCTRN1
      - [0x2B, 0x00, 0x00, 0x01, 0x3F]                                                     # PASET (rows 0-319)
      - [0x2A, 0x00, 0x00, 0x00, 0xEF]                                                     # CASET (cols 0-239)
      - [0x11]                                                                             # SLPOUT
      - [0x29]                                                                             # DISPON

touchscreen:
  - platform: ft63x6
    id: tft_touch
    display: tft_display
    i2c_id: i2c_bus_touch
