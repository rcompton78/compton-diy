; Tamagotchi+ — Waveshare ESP32-S3-Touch-LCD-1.69
;
; Board: ESP32-S3R8 (16MB flash, 8MB OPI PSRAM), 1.69" ST7789V2 240x280 + CST816T touch,
;        QMI8658 IMU + PCF85063 RTC on the shared touch I2C bus.
; Flash:  pnpm nx run tamagotchi-plus:flash-waveshare-s3-169
; Serial monitor:  pnpm nx run tamagotchi-plus:monitor

[env:waveshare-s3-169]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; The devkitc-1 board definition assumes 8MB flash / no PSRAM — override for the
; ESP32-S3R8 + 16MB flash module on this board. default_16MB.csv keeps two OTA app slots.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

lib_extra_dirs = ../../libs

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.0.3
    https://github.com/tzapu/WiFiManager.git
    jnthas/Improv WiFi Library@^0.0.2

; TFT_eSPI config for the ST7789V2 (240x280 visible out of the controller's 240x320 RAM;
; CGRAM_OFFSET makes TFT_eSPI apply the 20px row offset for a 280-high panel).
; This panel is wired BGR (verified on hardware: TFT_RGB rendered cyan as yellow), so the
; color order is pinned explicitly rather than left to TFT_eSPI's CGRAM_OFFSET-dependent
; default. rotation=0 → portrait 240×280, with the USB-C port on the left edge of the screen.
build_flags =
    -D BOARD_WAVESHARE_S3_169=1
    -D FIRMWARE_VERSION=\"${sysenv.RELEASE_VERSION}\"
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=280
    -D CGRAM_OFFSET=1
    -D TFT_MISO=-1
    -D TFT_MOSI=7
    -D TFT_SCLK=6
    -D TFT_CS=5
    -D TFT_DC=4
    -D TFT_RST=8
    -D TFT_BL=15
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=40000000
    -D USE_HSPI_PORT=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
