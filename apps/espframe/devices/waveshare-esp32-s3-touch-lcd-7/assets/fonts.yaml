# =============================================================================
# FONTS - Clock, UI, and slideshow text
# =============================================================================
# Noto Sans at multiple sizes. The clock font uses a minimal glyph set for
# digits; smaller sizes include broader glyphs for setup screens and text.
# Location metadata uses broad Noto glyph coverage for Immich place names.
# Middle East scripts use script-specific Noto extras so the main location
# font can keep its existing European coverage.
#
# Sized at ~0.6x the guition-esp32-p4-jc8012p4a1 device's point sizes to
# match this device's 480px logical height vs the P4's 800px (both devices
# are landscape widescreen, so height is the more relevant scaling axis).
# =============================================================================

