# =============================================================================
# FIRMWARE UPDATE - OTA and HTTP update from GitHub
# =============================================================================
# Provides OTA (over-the-air) and HTTP-based firmware updates. The device
# checks a stable manifest on GitHub and can auto-update
# when new versions are available. Update checks run on an interval (hourly,
# daily, weekly, or monthly) when auto-update is enabled; a manual "Check for Update"
# button triggers an immediate check. Version is exposed as a text sensor for
# diagnostics.
#
# firmware_version: default for local builds; overridden by main config
# (e.g. factory.yaml) or by -s firmware_version when building releases.
#
# firmware_manifest_url: each device's packages.yaml sets its own, unless a
# build entry point overrides it (the Guition v3 build does). The URL
# actually polled (firmware_source_url, set by firmware_refresh_source) is the
# saved Manifest URL setting if it's a valid URL, else this build default. An
# empty result (a build with no default and nothing saved, e.g. a fork's local
# build) turns update checks off: nothing below checks or installs while it's
# empty, and the update component points at firmware_update_off_url only
# because ESPHome requires a valid URL there.
# =============================================================================

substitutions:
  firmware_version: "dev"
  firmware_update_off_url: "http://update-checks-off.invalid/manifest.json"
  firmware_manifest_url: "https://rcompton78.github.io/compton-diy/espframe/manifest.json"
  # The shared manifest every device used to poll by default. It can't list
  # two builds for one chipFamily (ESPHome takes the first match, so the 7"
  # Waveshare installed the Freenove S3 build, COM-427), so each device now
  # defaults to its own manifest-<device>.json instead. A saved URL survives
  # reflashes, so on_boot below moves a device off this one.
  legacy_firmware_manifest_url: "https://rcompton78.github.io/compton-diy/espframe/manifest.json"
  # Another build's manifest for the same chip family that a saved URL could
  # still name, e.g. from a backup of a pre-v3 10" frame restored onto a v3
  # board (COM-690). Its image can't boot this chip, so every update would fail;
  # set_action saves firmware_manifest_url in its place, and on_boot moves an
  # already-saved one. Empty: never.
  sibling_firmware_manifest_url: ""

esphome:
  project:
    name: jtenniswood.immich-frame
    version: "${firmware_version}"
  on_boot:
    - priority: -50
      then:
        - if:
            condition:
              lambda: 'return id(firmware_update_reboot_pending);'
            then:
              - delay: 15s
              - script.execute: firmware_update_recover_display
    - priority: -100
      then:
        - lambda: |-
            const std::string legacy_url = "${legacy_firmware_manifest_url}";
            const std::string default_url = "${firmware_manifest_url}";
            if (!legacy_url.empty() && default_url != legacy_url &&
                strip_trailing_slashes(id(firmware_manifest_url_text).state) == legacy_url) {
              // A call (not publish_state) so the template text persists it.
              id(firmware_manifest_url_text).make_call().set_value(default_url).perform();
              global_preferences->sync();
              ESP_LOGI("firmware", "Migrated firmware manifest URL from the shared manifest to %s", default_url.c_str());
            }
            const std::string sibling_url = "${sibling_firmware_manifest_url}";
            if (!sibling_url.empty() && default_url != sibling_url &&
                strip_trailing_slashes(id(firmware_manifest_url_text).state) == sibling_url) {
              id(firmware_manifest_url_text).make_call().set_value(default_url).perform();
              global_preferences->sync();
              ESP_LOGI("firmware", "Migrated firmware manifest URL from another chip revision's manifest to %s", default_url.c_str());
            }
            id(firmware_refresh_source).execute();
        - component.update: firmware_version_sensor

# -----------------------------------------------------------------------------
# State for update check interval
# -----------------------------------------------------------------------------
globals:
  - id: update_check_counter
    type: int
    initial_value: '0'
  - id: manual_check_only
    type: bool
    initial_value: 'false'
  - id: firmware_update_reboot_pending
    type: bool
    restore_value: true
    initial_value: 'false'
  # Set while an OTA download runs; the slideshow starts no fetches meanwhile.
  - id: firmware_update_in_progress
    type: bool
    initial_value: 'false'
  # The manifest URL update checks use; empty means checks are off.
  - id: firmware_source_url
    type: std::string
    initial_value: '""'

script:
  # Resolves firmware_source_url from the saved setting and the build default
  # and points the update component at it. The saved setting can hold "" or an
  # invalid URL (the template text persists the raw input even when set_action
  # rejects or replaces it), so neither may turn off a build that has a default.
  - id: firmware_refresh_source
    mode: restart
    then:
      - lambda: |-
          std::string url = strip_trailing_slashes(id(firmware_manifest_url_text).state);
          if (url.empty() || !is_valid_http_url(url)) url = "${firmware_manifest_url}";
          id(firmware_source_url) = url;
          id(firmware_update).set_source_url(url.empty() ? "${firmware_update_off_url}" : url);
  # Runs from the OTA's on_begin, before it fetches the MD5 or opens the
  # firmware download. Each open photo download holds a TLS session and an
  # image decoder in internal RAM; with them open, the OTA's own TLS session
  # can fail to allocate (mbedtls -0x7F00). Aborting them frees that memory
  # without touching the decoded photos in PSRAM, so the screen keeps its
  # photo. Must not delay: the OTA connects as soon as this returns.
  - id: firmware_update_pause_slideshow
    mode: restart
    then:
      - lambda: |-
          ESP_LOGI("firmware", "Pausing slideshow for firmware update (internal heap free %u, largest block %u)",
                   (unsigned) heap_caps_get_free_size(MALLOC_CAP_INTERNAL),
                   (unsigned) heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL));
          id(firmware_update_in_progress) = true;
          id(delayed_prefetch_chain).stop();
          id(deferred_fetch_into_slot).stop();
          id(deferred_companion_search).stop();
          id(deferred_slot0_image_update).stop();
          id(deferred_slot1_image_update).stop();
          id(deferred_slot2_image_update).stop();
          id(deferred_portrait_left_update).stop();
          id(deferred_portrait_right_update).stop();
          id(deferred_preload_left_update).stop();
          id(deferred_preload_right_update).stop();
          id(espframe_core).slideshow().clear_commands();
          id(immich_img_0).abort_download();
          id(immich_img_1).abort_download();
          id(immich_img_2).abort_download();
          id(immich_portrait_left).abort_download();
          id(immich_portrait_right).abort_download();
          id(immich_portrait_preload_left).abort_download();
          id(immich_portrait_preload_right).abort_download();
          ESP_LOGI("firmware", "Slideshow paused (internal heap free %u, largest block %u)",
                   (unsigned) heap_caps_get_free_size(MALLOC_CAP_INTERNAL),
                   (unsigned) heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL));
  # Runs when the OTA fails (a successful one reboots). The aborted fetches
  # left slot and portrait state half set, so restart the slideshow the same
  # way a settings change does.
  - id: firmware_update_resume_slideshow
    mode: restart
    then:
      - lambda: |-
          id(firmware_update_in_progress) = false;
          if (id(firmware_update_reboot_pending)) {
            id(firmware_update_reboot_pending) = false;
            global_preferences->sync();
          }
          ESP_LOGW("firmware", "Firmware update failed; resuming slideshow");
      - delay: 1s
      - script.execute: immich_connection_config_changed
  - id: firmware_update_recover_display
    mode: restart
    then:
      - script.stop: screen_schedule_wake_timeout_check
      - if:
          condition:
            lambda: |-
              return id(backlight_manual_off) ||
                     (id(schedule_enabled).state && id(screen_schedule_asleep));
          then:
            - lambda: |-
                bool scheduled_sleep = id(schedule_enabled).state && id(screen_schedule_asleep);
                id(firmware_update_reboot_pending) = false;
                id(backlight_paused) = true;
                id(screensaver_display_off_active) = true;
                id(manual_wake_ms) = 0;
                if (scheduled_sleep) {
                  id(screen_schedule_asleep) = true;
                  id(backlight_manual_off) = false;
                } else {
                  id(screen_schedule_asleep) = false;
                  id(backlight_manual_off) = true;
                }
                global_preferences->sync();
                ESP_LOGI("firmware", "Preserved display sleep state after firmware update");
            - script.execute: backlight_schedule_display_off
            - if:
                condition:
                  lambda: 'return id(schedule_enabled).state && id(screen_schedule_asleep);'
                then:
                  - script.execute: screen_schedule_boot_recover
          else:
            - script.stop: screen_schedule_sleep
            - script.stop: backlight_schedule_display_off
            - lambda: |-
                id(firmware_update_reboot_pending) = false;
                id(backlight_manual_off) = false;
                id(screen_schedule_asleep) = false;
                id(screensaver_display_off_active) = false;
                id(backlight_paused) = false;
                id(manual_wake_ms) = 0;
                global_preferences->sync();
                ESP_LOGI("firmware", "Recovered display state after firmware update");
            - lvgl.resume:
            - script.execute: screen_schedule_restore_page
            - delay: 100ms
            - script.execute: backlight_apply_brightness
      - delay: 2s
      - script.execute: immich_connection_config_changed

# -----------------------------------------------------------------------------
# OTA and HTTP update source
# -----------------------------------------------------------------------------
ota:
  # Both install paths (the web UI's Install and update.perform below) end in
  # this platform's flash(), which fires these triggers on the main loop.
  - platform: http_request
    on_begin:
      - script.execute: firmware_update_pause_slideshow
    on_error:
      - script.execute: firmware_update_resume_slideshow
    on_abort:
      - script.execute: firmware_update_resume_slideshow

update:
  - platform: http_request
    id: firmware_update
    name: "Firmware: Update"
    internal: true
    # Never fetched while firmware_source_url is empty (see the header).
    source: "${firmware_manifest_url if firmware_manifest_url else firmware_update_off_url}"
    update_interval: never
    on_update_available:
      then:
        # firmware_version defaults to "dev" unless scripts/espframe-esphome.sh
        # threads a real RELEASE_VERSION in via -s (see COM-279) -- an
        # unversioned/local build always mismatches the published manifest, so
        # skip auto-install entirely for one rather than looping forever if
        # auto-update is left on against a real manifest during dev testing.
        - if:
            condition:
              lambda: 'return strcmp("${firmware_version}", "dev") != 0 && !id(firmware_source_url).empty() && id(auto_update_switch).state && !id(manual_check_only);'
            then:
              - lambda: |-
                  id(firmware_update_reboot_pending) = true;
                  global_preferences->sync();
              - update.perform: firmware_update

# -----------------------------------------------------------------------------
# User controls: auto-update and check frequency
# -----------------------------------------------------------------------------
text:
  - platform: template
    name: "Firmware: Manifest URL"
    id: firmware_manifest_url_text
    internal: true
    entity_category: config
    # ESPFRAME:SETTING_FIELDS firmware_manifest_url START
    optimistic: false
    restore_value: true
    initial_value: "${firmware_manifest_url}"
    min_length: 0
    max_length: 255
    mode: text
    # ESPFRAME:SETTING_FIELDS firmware_manifest_url END
    icon: "mdi:web"
    web_server:
      sorting_group_id: sg_firmware
    set_action:
      - lambda: |-
          std::string url = strip_trailing_slashes(x);
          if (url.empty()) url = "${firmware_manifest_url}";
          // Another chip revision's manifest (e.g. from a restored backup) can
          // never install here; keep this build's own instead.
          const std::string sibling_url = "${sibling_firmware_manifest_url}";
          if (!sibling_url.empty() && url == sibling_url) url = "${firmware_manifest_url}";
          if (!url.empty() && !is_valid_http_url(url)) {
            ESP_LOGW("firmware", "Firmware manifest URL must be a valid http(s)://host[:port]/path URL");
            return;
          }
          id(firmware_manifest_url_text).publish_state(url);
          id(firmware_refresh_source).execute();
          global_preferences->sync();
          if (url.empty()) {
            // No default manifest in this build: an empty URL turns update checks off.
            ESP_LOGI("firmware", "Firmware manifest URL cleared; update checks are off");
          } else {
            ESP_LOGI("firmware", "Firmware manifest URL configured: %s", url.c_str());
          }

switch:
  - platform: template
    name: "Firmware: Auto Update"
    id: auto_update_switch
    entity_category: config
    icon: "mdi:update"
    optimistic: true
    # ESPFRAME:SETTING_FIELDS auto_update START
    restore_mode: RESTORE_DEFAULT_ON
    # ESPFRAME:SETTING_FIELDS auto_update END
    web_server:
      sorting_group_id: sg_firmware

select:
  - platform: template
    name: "Firmware: Update Frequency"
    id: update_frequency_select
    entity_category: config
    icon: "mdi:timer-outline"
    web_server:
      sorting_group_id: sg_firmware
    # ESPFRAME:SETTING_FIELDS update_frequency START
    options:
      - "Hourly"
      - "Daily"
      - "Weekly"
      - "Monthly"
    initial_option: "Daily"
    optimistic: true
    restore_value: true
    # ESPFRAME:SETTING_FIELDS update_frequency END

# -----------------------------------------------------------------------------
# Periodic update check (hourly / daily / weekly / monthly when auto-update on)
# -----------------------------------------------------------------------------
interval:
  - interval: 1h
    then:
      - lambda: |-
          if (!id(auto_update_switch).state) return;
          if (id(firmware_source_url).empty()) return;
          int counter = id(update_check_counter);
          std::string freq = id(update_frequency_select).current_option();
          int threshold = 24;
          if (freq == "Hourly") threshold = 1;
          else if (freq == "Weekly") threshold = 168;
          else if (freq == "Monthly") threshold = 720;
          if (counter % threshold == 0) {
            id(firmware_refresh_source).execute();
            id(firmware_update).update();
          }
          id(update_check_counter) = counter + 1;

# -----------------------------------------------------------------------------
# Exposed version and manual check button
# -----------------------------------------------------------------------------
text_sensor:
  - platform: template
    name: "Firmware: Version"
    id: firmware_version_sensor
    entity_category: diagnostic
    icon: "mdi:tag"
    web_server:
      sorting_group_id: sg_firmware
    update_interval: never
    lambda: 'return {"${firmware_version}"};'

button:
  - platform: template
    name: "Firmware: Check for Update"
    entity_category: config
    icon: "mdi:update"
    web_server:
      sorting_group_id: sg_firmware
    on_press:
      - lambda: 'id(manual_check_only) = true;'
      - script.execute: firmware_refresh_source
      - if:
          condition:
            lambda: 'return id(firmware_source_url).empty();'
          then:
            - logger.log:
                level: WARN
                tag: firmware
                format: "No firmware manifest URL set; update checks are off"
          else:
            - component.update: firmware_update
      - delay: 15s
      - lambda: 'id(manual_check_only) = false;'
