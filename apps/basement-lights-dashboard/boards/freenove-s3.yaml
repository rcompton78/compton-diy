# =============================================================================
# BOARD HAL: Freenove ESP32-S3 CYD 2.8" (ILI9341 240x320 + FT6336U touch)
# =============================================================================
# Hardware-only ESPHome package (COM-629): chip, PSRAM, a dimmable backlight,
# the SPI display and I2C touch. No app logic (no wifi/api/ota/UI) lives here
# on purpose. Provides `tft_display`, `tft_touch` and `backlight`, like
# boards/crowpanel-5.yaml; layouts/freenove-s3.yaml turns it to landscape.
#
# Trimmed from apps/media-room-dashboard/boards/freenove-s3.yaml (same board),
# which has the full story behind each choice below. Left out: its battery
# sleep tiers (light sleep, deep sleep, the wake guard), the battery sensors
# and dev mode: this one runs on USB power, in a stand. Also unlike it:
#   - the panel is the board's own upright orientation (`mirror_x: true`, as
#     in espframe's freenove-s3 device and media-room before COM-445's 180°
#     flip), with no touch transform; LVGL's software `rotation:` (in the
#     layout) makes it landscape and turns touch with it.
#   - the backlight is LEDC PWM, as in espframe, so the screen saver can dim
#     it. media-room uses a plain GPIO only because light sleep stops LEDC.
#   - the CPU runs at the board's full 240MHz (no light sleep to tune for).
#
# Logs and flashing go over the native USB port (USB-Serial/JTAG, ESPHome's
# default on the S3).
# =============================================================================

esp32:
  variant: ESP32S3
  flash_size: 16MB
  cpu_frequency: 240MHZ
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

esphome:
  on_boot:
    # The ILI9341 wants ~120ms after SLPOUT before DISPON takes reliably, but
    # a CUSTOM init_sequence can't express that delay, so init sends SLPOUT
    # then DISPON back to back. Resending DISPON after the settle time makes
    # it datasheet-correct (as in media-room-dashboard). Runs right after the
    # display's setup (800).
    - priority: 790
      then:
        - lambda: |-
            delay(120);
            id(tft_display).command(0x29);  // DISPON

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO45

light:
  # Internal: layouts/freenove-s3.yaml's screen saver owns it (full while in
  # use, dimmed under the floating clock). gamma_correct 1.0 makes a
  # brightness the PWM duty itself, so saver_brightness means what it says.
  - platform: monochromatic
    id: backlight
    internal: true
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    gamma_correct: 1.0
    default_transition_length: 0s

spi:
  id: spi_bus_display
  clk_pin: GPIO12
  mosi_pin: GPIO11
  miso_pin: GPIO13

i2c:
  - id: i2c_bus_touch
    sda: GPIO16
    scl: GPIO15
    frequency: 400kHz

# BGR order, inverted colours and the alternate init sequence below all match
# media-room-dashboard's and espframe's freenove-s3 configs: ESPHome's stock
# "ILI9341" model leaves this panel blank white.
display:
  - platform: ili9xxx
    model: CUSTOM
    id: tft_display
    spi_id: spi_bus_display
    cs_pin: GPIO10
    dc_pin: GPIO46
    color_order: BGR
    invert_colors: true
    auto_clear_enabled: false
    update_interval: never
    transform:
      mirror_x: true
    dimensions:
      width: 240
      height: 320
    init_sequence:
      - [0xCF, 0x00, 0xC1, 0x30]
      - [0xED, 0x64, 0x03, 0x12, 0x81]
      - [0xE8, 0x85, 0x00, 0x78]
      - [0xCB, 0x39, 0x2C, 0x00, 0x34, 0x02]
      - [0xF7, 0x20]
      - [0xEA, 0x00, 0x00]
      - [0xC0, 0x10]                                                                       # PWCTR1
      - [0xC1, 0x00]                                                                       # PWCTR2
      - [0xC5, 0x30, 0x30]                                                                 # VMCTR1
      - [0xC7, 0xB7]                                                                       # VMCTR2
      - [0x3A, 0x55]                                                                       # PIXFMT (16bpp)
      - [0x36, 0x08]                                                                       # MADCTL (BGR, no rotation)
      - [0xB1, 0x00, 0x1A]                                                                 # FRMCTR1
      - [0xB6, 0x08, 0x82, 0x27]                                                           # DFUNCTR
      - [0xF2, 0x00]                                                                       # 3Gamma disable
      - [0x26, 0x01]                                                                       # GAMMASET
      - [0xE0, 0x0F, 0x2A, 0x28, 0x08, 0x0E, 0x08, 0x54, 0xA9, 0x43, 0x0A, 0x0F, 0x00, 0x00, 0x00, 0x00]  # GMCTRP1
      - [0xE1, 0x00, 0x15, 0x17, 0x07, 0x11, 0x06, 0x2B, 0x56, 0x3C, 0x05, 0x10, 0x0F, 0x3F, 0x3F, 0x0F]  # GMCTRN1
      - [0x2B, 0x00, 0x00, 0x01, 0x3F]                                                     # PASET (rows 0-319)
      - [0x2A, 0x00, 0x00, 0x00, 0xEF]                                                     # CASET (cols 0-239)
      - [0x11]                                                                             # SLPOUT
      - [0x29]                                                                             # DISPON
      # Terminator, REQUIRED: without it the driver reads past the end of the
      # sequence and sends heap bytes to the panel (black screen after an
      # unrelated config change). See CLAUDE.md's ili9xxx note.
      - [0x00]

# No reset_pin: ESPHome's ft63x6 reads the chip 10ms after toggling reset,
# far sooner than the FT6336U is back up, so the chip's own power-on boot
# stands in for it (see media-room-dashboard's board file). No interrupt_pin
# either: polled.
touchscreen:
  - platform: ft63x6
    id: tft_touch
    display: tft_display
    i2c_id: i2c_bus_touch
