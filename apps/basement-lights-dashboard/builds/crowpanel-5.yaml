# =============================================================================
# BUILD: Basement Lights Dashboard - Elecrow CrowPanel 5.0" HMI (Basic)
# =============================================================================
# Entrypoint passed to `esphome`/scripts/espframe-esphome.sh. Combines the
# crowpanel-5 board HAL, the shared dashboard app logic and the 480x800
# portrait layout. Another board gets its own builds/<name>.yaml with its own
# board and layout (see builds/freenove-s3.yaml).
# =============================================================================

substitutions:
  name: "basement-lights-crowpanel-5"
  friendly_name: "Basement Lights"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

packages:
  board: !include ../boards/crowpanel-5.yaml
  dashboard: !include ../common/dashboard.yaml
  layout: !include ../layouts/crowpanel-5.yaml
