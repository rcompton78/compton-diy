# =============================================================================
# DASHBOARD APP LOGIC - board-agnostic (480x800 portrait)
# =============================================================================
# WiFi/API/logger, OTA + auto-update checking (the same http_request-manifest
# mechanism as media-room-dashboard and espframe), and the LVGL touch UI:
# three toggles, Office, Board Games and All, each bound to a Home Assistant
# light group and called directly over the native API
# (`homeassistant.service`). Each toggle's state comes back down the same
# connection through `homeassistant` text sensors subscribed to exactly those
# groups, all `internal: true`. It's a remote with feedback, not a general HA
# dashboard. A group reads "on" while any of its lights is on, so the panel
# never needs a reflash when a group's members change: that's an edit in HA.
#
# The only entities it exposes are diagnostics (firmware version, IP
# address) and firmware update controls, also shown in the unprotected web
# portal at http://<device-ip>/ (see web_server below).
#
# Requires a board package to have already defined `tft_display` (an 800x480
# display, turned to portrait by LVGL's rotation below), `tft_touch`
# (touchscreen) and `backlight` (a light), see boards/crowpanel-5.yaml.
#
# Screen on/off (COM-533): the backlight is on at full or off, never dimmed.
# It turns on when the basement motion sensor fires or the screen is touched,
# and off after screen_on_time with neither. While it's off, a touch only
# wakes it and never reaches a toggle. While HA isn't connected there's no
# motion to wake it, so it stays on. Burn-in: the whole main page moves a
# few pixels every pixel_shift_interval (an LCD doesn't burn in like an
# OLED, but a fixed layout can leave faint image retention).
# =============================================================================

substitutions:
  firmware_version: "dev"
  firmware_manifest_url: "https://rcompton78.github.io/compton-diy/basement-lights-dashboard/manifest.json"
  # The three HA light groups (COM-533). Membership lives in HA.
  office_group: "light.dad_s_office_lights"
  games_group: "light.basement_board_games"
  all_group: "light.basement_lights"
  # Basement PIR (Tuya, Zigbee). It reports "on" for ~35-70 s per movement,
  # so the screen holds for screen_on_time after the last one.
  motion_sensor: "binary_sensor.0xa4c138abf0cc23b5_occupancy"
  screen_on_time: "1h"
  # Panel orientation. 90 or 270 is portrait; use the other one if the
  # picture comes out upside down for the way the panel is mounted.
  screen_rotation: "90"
  pixel_shift_interval: "10min"
  # The main page moves to each of the 3x3 offsets {-px, 0, +px} in turn.
  pixel_shift_px: "4"
  # main_page palette, shared with media-room-dashboard (COM-530/531). Flat
  # fills only: the panel is RGB565, so gradients band.
  ui_bg: 0x0B0E13
  ui_card: 0x1A1F27
  ui_card_edge: 0x262C36
  ui_press: 0x2C3440
  ui_press_halo: 0x38414F
  ui_ink: 0xF2F4F7
  ui_quiet: 0x8A93A3
  ui_faint: 0x5B6474
  ui_amber: 0xF5A623
  ui_amber_halo: 0xFFC861
  ui_on_amber: 0x1A1205
  ui_off_halo: 0x222833
  # Material Design Icons codepoints, see icon_font_* below.
  icon_desk_lamp: "\U000F095F"
  icon_dice: "\U000F076E"
  icon_home_bulb: "\U000F1251"

esphome:
  project:
    name: "compton-diy.basement-lights-dashboard"
    version: "${firmware_version}"
  on_boot:
    - priority: -200
      then:
        # Each toggle passes its pressed/checked state on to its halo, icon,
        # name, subtitle and pill, which colour themselves per state;
        # inheritance from the button can't give them different colours
        # (same trick as media-room-dashboard's light tiles, COM-531).
        - lambda: |-
            for (lv_obj_t *btn : {id(btn_office), id(btn_games), id(btn_all)})
              lv_obj_add_flag(btn, LV_OBJ_FLAG_STATE_TRICKLE);
        # Screen on from boot; motion or touch keep it on from here.
        - script.execute: screen_off_countdown

# No compile-time ssid/password: credentials come from the captive-portal
# setup flow at first boot and live in NVS, so they survive OTA updates.
wifi:
  ap:
    ssid: "${friendly_name} Setup"
  # on_connect/on_disconnect only fire on a real connected<->disconnected
  # edge, so the interval below watches for the fallback AP itself and swaps
  # in setup_page once. These reset its one-shot guard.
  on_connect:
    - globals.set:
        id: setup_page_shown
        value: "false"
    - lvgl.page.show: main_page
  on_disconnect:
    - globals.set:
        id: setup_page_shown
        value: "false"
    - script.execute: wake_screen
    # Never leave a stale address in the footer; the ip_address sensor
    # repaints it on the next connect.
    - lvgl.label.update:
        id: lbl_ip_footer
        text: ""
    - lvgl.page.show: connecting_page

globals:
  - id: setup_page_shown
    type: bool
    initial_value: "false"
  # True while the backlight is off, see screen_off.
  - id: screen_dark
    type: bool
    initial_value: "false"
  # Which of the nine pixel-shift offsets main_page is at, see shift_pixels.
  - id: pixel_shift_step
    type: int
    initial_value: "0"

interval:
  # Moves from connecting_page to setup_page once the fallback AP is up.
  - interval: 1s
    then:
      - if:
          condition:
            and:
              - wifi.ap_active:
              - lambda: 'return !id(setup_page_shown);'
          then:
            - globals.set:
                id: setup_page_shown
                value: "true"
            - script.execute: wake_screen
            - lvgl.page.show: setup_page
  # Install a published update while nobody is using the panel (screen off
  # means no motion or touch for screen_on_time). The flash and reboot take
  # about a minute. Unversioned "dev" builds never auto-install: they always
  # mismatch the manifest, so they'd replace a build someone is testing.
  # Install Firmware Update does it on demand.
  - interval: 15min
    then:
      - if:
          condition:
            and:
              - update.is_available: firmware_update
              - lambda: 'return id(screen_dark) && strcmp("${firmware_version}", "dev") != 0;'
          then:
            - logger.log:
                format: "Screen off: installing firmware update"
                level: INFO
            - update.perform: firmware_update
  - interval: ${pixel_shift_interval}
    then:
      - script.execute: shift_pixels

captive_portal:

# -----------------------------------------------------------------------------
# Admin portal: ESPHome's stock web UI at http://<device-ip>/ (the address in
# the main page footer), with the diagnostics, the update entity and its
# Check/Install buttons, and `ota: platform: web_server`'s upload form.
# `local: true` embeds the UI so it works from a phone on the setup AP with no
# internet. Deliberately unprotected, like media-room-dashboard, cyd-clock and
# espframe: anyone on the LAN (or the open setup AP) can flash it.
# -----------------------------------------------------------------------------
web_server:
  port: 80
  version: 3
  local: true

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key
  # No reboot when HA stays away: rebooting fixes nothing here, and wifi
  # reconnects by itself.
  reboot_timeout: 0s
  # HA is back: motion can wake the screen again, so the off timer runs.
  on_client_connected:
    - script.execute: screen_off_countdown
  # Once HA is gone the imported states are frozen, so drop every toggle to
  # neutral rather than show state that may no longer be true; HA re-sends
  # every subscribed state on reconnect. With no motion to wake it, the screen
  # also stays on until HA is back. Only when no state-subscribed client
  # remains, so an `esphome logs` session ending changes nothing.
  on_client_disconnected:
    - if:
        condition:
          not:
            api.connected:
              state_subscription_only: true
        then:
          - script.execute: reset_toggle_states
          - script.stop: screen_off_countdown
          - script.execute: wake_screen

# -----------------------------------------------------------------------------
# OTA + update check against the GitHub Pages manifest (see CLAUDE.md's
# "Release workflow": dist/basement-lights-dashboard/manifest.json).
# -----------------------------------------------------------------------------
http_request:

ota:
  - platform: http_request
  # Upload form in the web portal above.
  - platform: web_server
  # `esphome upload --device <ip>` from a laptop.
  - platform: esphome

update:
  - platform: http_request
    id: firmware_update
    name: "Firmware Update"
    source: ${firmware_manifest_url}
    update_interval: 6h

# The stock web_server v3 UI has no install control on the update entity, so
# the portal gets these. Install isn't skipped on "dev" builds: pressing it on
# a local build replaces it with the published release.
button:
  - platform: template
    name: "Check for Firmware Update"
    icon: "mdi:update"
    entity_category: config
    on_press:
      - component.update: firmware_update
  - platform: template
    name: "Install Firmware Update"
    icon: "mdi:download"
    entity_category: config
    on_press:
      - update.perform: firmware_update

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - script.execute: refresh_clock
    on_time:
      - seconds: 0
        then:
          - script.execute: refresh_clock

text_sensor:
  - platform: template
    name: "Firmware Version"
    entity_category: diagnostic
    # Not `never`: a template sensor with no interval never publishes at all.
    update_interval: 1h
    lambda: 'return {"${firmware_version}"};'

  # Station IP, shown in the main page footer and on connecting_page so the
  # device and its web portal can be found without the router or HA.
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
      on_value:
        - if:
            condition:
              lambda: 'return !x.empty() && x != "0.0.0.0";'
            then:
              - lvgl.label.update:
                  id: lbl_ip_footer
                  text: !lambda 'return "http://" + x;'
              - lvgl.label.update:
                  id: lbl_connecting_ip
                  text: !lambda 'return "Not connected\nLast IP: " + x;'

  # ---------------------------------------------------------------------------
  # Group state imported from HA. Text sensors rather than binary sensors so
  # "unavailable"/"unknown" stay their own values instead of collapsing into
  # off. HA pushes subscribed states to any paired device; no "allow actions"
  # toggle needed for these. The toggles aren't `checkable`, so a tap never
  # flips the highlight by itself: it changes once HA confirms the new state.
  # ---------------------------------------------------------------------------
  # Basement motion from HA, as text like the group states, so
  # "unavailable"/"unknown" read as not-motion (a homeassistant binary sensor
  # keeps its last state on those, which would hold the screen on forever if
  # the PIR dropped off while reading "on"). "on" turns the screen on and
  # restarts the off timer, whether the screen was on or off; any other value
  # restarts the timer too, so screen_on_time counts from the last movement,
  # and screen_off never fires while the sensor still reads "on".
  - platform: homeassistant
    id: basement_motion
    entity_id: ${motion_sensor}
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return x == "on";'
          then:
            - script.execute: wake_screen
      - script.execute: screen_off_countdown

  - platform: homeassistant
    id: office_state
    entity_id: ${office_group}
    internal: true
    on_value:
      - script.execute: refresh_toggles

  - platform: homeassistant
    id: games_state
    entity_id: ${games_group}
    internal: true
    on_value:
      - script.execute: refresh_toggles

  - platform: homeassistant
    id: all_state
    entity_id: ${all_group}
    internal: true
    on_value:
      - script.execute: refresh_toggles

script:
  # Repaints all three toggles from the imported states: checked (amber) when
  # on, the pill's ON/OFF ("--" for unavailable/unknown), and the All row's
  # summary line, which reads the two rooms rather than the All group so it
  # can say which one is on.
  - id: refresh_toggles
    then:
      - lambda: |-
          struct Toggle { lv_obj_t *btn; lv_obj_t *pill; const std::string &state; };
          for (const Toggle &t : {Toggle{id(btn_office), id(pill_office), id(office_state).state},
                                  Toggle{id(btn_games), id(pill_games), id(games_state).state},
                                  Toggle{id(btn_all), id(pill_all), id(all_state).state}}) {
            bool on = t.state == "on";
            if (on)
              lv_obj_add_state(t.btn, LV_STATE_CHECKED);
            else
              lv_obj_remove_state(t.btn, LV_STATE_CHECKED);
            lv_label_set_text(t.pill, on ? "ON" : (t.state == "off" ? "OFF" : "--"));
          }
          const std::string &office = id(office_state).state;
          const std::string &games = id(games_state).state;
          const char *summary = "";
          if (office == "on" && games == "on")
            summary = "Both rooms on";
          else if (office == "on")
            summary = "Office is on";
          else if (games == "on")
            summary = "Board Games is on";
          else if (office == "off" && games == "off")
            summary = "Everything is off";
          lv_label_set_text(id(lbl_all_summary), summary);

  - id: reset_toggle_states
    then:
      - lambda: |-
          for (lv_obj_t *btn : {id(btn_office), id(btn_games), id(btn_all)})
            lv_obj_remove_state(btn, LV_STATE_CHECKED);
          for (lv_obj_t *pill : {id(pill_office), id(pill_games), id(pill_all)})
            lv_label_set_text(pill, "--");
          lv_label_set_text(id(lbl_all_summary), "");

  # 12-hour clock in the header, from HA's time. Blank until the first sync.
  - id: refresh_clock
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          if (!now.is_valid()) {
            lv_label_set_text(id(lbl_clock), "");
            return;
          }
          int hour = now.hour % 12;
          char buf[12];
          snprintf(buf, sizeof(buf), "%d:%02d %s", hour == 0 ? 12 : hour, now.minute, now.hour < 12 ? "AM" : "PM");
          lv_label_set_text(id(lbl_clock), buf);

  # Burn-in guard: step main_content through the nine offsets of a 3x3 grid
  # (-px, 0, +px on each axis), one step per pixel_shift_interval. The page
  # around it is the same background colour, so only the content moves.
  - id: shift_pixels
    then:
      - lambda: |-
          id(pixel_shift_step) = (id(pixel_shift_step) + 1) % 9;
          int dx = (id(pixel_shift_step) % 3 - 1) * ${pixel_shift_px};
          int dy = (id(pixel_shift_step) / 3 - 1) * ${pixel_shift_px};
          lv_obj_set_pos(id(main_content), dx, dy);

  # Restarted by every motion sensor state from HA (motion, clear, or
  # unavailable), every touch release and HA connecting; turns the screen off once it runs out (unless the motion
  # sensor still reads motion, see screen_off). Never while HA is away (nothing
  # could wake the screen but a touch), see api on_client_disconnected.
  - id: screen_off_countdown
    mode: restart
    then:
      - delay: ${screen_on_time}
      - if:
          condition:
            api.connected:
              state_subscription_only: true
          then:
            - script.execute: screen_off

  # Backlight off and LVGL paused. Paused (with resume_on_input off, see
  # lvgl: below) LVGL doesn't read touch at all, so the touch that wakes the
  # screen never reaches a toggle.
  - id: screen_off
    then:
      - if:
          condition:
            lambda: 'return !id(screen_dark) && id(basement_motion).state != "on" && id(main_page)->is_showing();'
          then:
            - globals.set:
                id: screen_dark
                value: "true"
            - logger.log:
                format: "No motion or touch for ${screen_on_time}: screen off"
                level: INFO
            - lvgl.pause:
            - light.turn_off: backlight

  - id: wake_screen
    then:
      - if:
          condition:
            lambda: 'return id(screen_dark);'
          then:
            - globals.set:
                id: screen_dark
                value: "false"
            - lvgl.resume:
            - light.turn_on:
                id: backlight
                brightness: 100%

# Wake on release, not touch: LVGL is still paused while the finger is down,
# so the whole waking tap is swallowed and only the next one acts. Every
# release (waking or not) restarts the off timer.
touchscreen:
  - id: !extend tft_touch
    on_release:
      - script.execute: wake_screen
      - script.execute: screen_off_countdown

# -----------------------------------------------------------------------------
# Fonts: Montserrat semibold at the mock-up's sizes (bold for the pills), plus
# LVGL's built-in montserrat_14/28 for the status pages. ASCII plus the "·"
# member separator. Icons are Material Design Icons with only the glyphs drawn.
# -----------------------------------------------------------------------------
font:
  - file: "gfonts://Montserrat@600"
    id: ui_font_13
    size: 13
    bpp: 4
    glyphs: &ascii_glyphs ' !"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[]^_`abcdefghijklmnopqrstuvwxyz{|}~·'
  - file: "gfonts://Montserrat@600"
    id: ui_font_14
    size: 14
    bpp: 4
    glyphs: *ascii_glyphs
  - file: "gfonts://Montserrat@600"
    id: ui_font_16
    size: 16
    bpp: 4
    glyphs: *ascii_glyphs
  - file: "gfonts://Montserrat@600"
    id: ui_font_22
    size: 22
    bpp: 4
    glyphs: *ascii_glyphs
  - file: "gfonts://Montserrat@600"
    id: ui_font_24
    size: 24
    bpp: 4
    glyphs: *ascii_glyphs
  - file: "gfonts://Montserrat@600"
    id: ui_font_30
    size: 30
    bpp: 4
    glyphs: *ascii_glyphs
  - file: "gfonts://Montserrat@700"
    id: ui_font_pill
    size: 14
    bpp: 4
    glyphs: "ONF-"
  - file: 'https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf'
    id: icon_font_64
    size: 64
    bpp: 4
    glyphs: ["${icon_desk_lamp}", "${icon_dice}", "${icon_home_bulb}"]

# -----------------------------------------------------------------------------
# Three LVGL pages. connecting_page (the default at boot, and whenever wifi
# drops), setup_page once the fallback AP is up, and main_page, COM-533's
# design P2 (a "switch plate"): a header (title and clock), three equal
# full-width rows (Office, Board Games, All), and the portal address in the
# footer. Every coordinate and colour is from
# docs/com-533-mockups/generate.py's design_p2. A toggle's lit (amber) style is
# its `checked` state, which only the imported HA state ever sets.
# -----------------------------------------------------------------------------
lvgl:
  displays: [tft_display]
  touchscreens: [tft_touch]
  rotation: ${screen_rotation}
  # The wake touch is handled by wake_screen, not LVGL (see screen_off).
  resume_on_input: false
  # Shared toggle look. Pressed: the press fill plus a 3px outline, which
  # sits outside the button so its contents don't shift; recolor_opa cancels
  # the default theme's 35% darken. Theme pressed beats a widget's own
  # default and checked styles (LVGL picks the highest matching state bits).
  theme:
    button:
      bg_color: ${ui_card}
      bg_opa: COVER
      text_color: ${ui_ink}
      radius: 28
      pad_all: 0
      border_width: 1
      border_color: ${ui_card_edge}
      shadow_opa: TRANSP
      checked:
        bg_color: ${ui_amber}
        border_color: ${ui_amber}
      pressed:
        bg_color: ${ui_press}
        recolor_opa: TRANSP
        outline_width: 3
        outline_pad: 0
        outline_color: ${ui_ink}
  pages:
    - id: connecting_page
      bg_color: ${ui_bg}
      bg_opa: COVER
      widgets:
        - label:
            align: CENTER
            y: -60
            text: "Connecting to WiFi"
            text_font: montserrat_14
            text_color: ${ui_ink}
        - label:
            align: CENTER
            y: -20
            text: "${friendly_name}"
            text_font: montserrat_28
            text_color: ${ui_ink}
        # Updated by the ip_address sensor to include the last address.
        - label:
            id: lbl_connecting_ip
            align: CENTER
            y: 60
            text: "Not connected"
            text_font: montserrat_14
            text_color: ${ui_quiet}
            text_align: CENTER
    - id: setup_page
      bg_color: ${ui_bg}
      bg_opa: COVER
      widgets:
        - label:
            align: CENTER
            y: -80
            text: "Connect to WiFi"
            text_font: montserrat_14
            text_color: ${ui_ink}
        - label:
            align: CENTER
            y: -40
            text: "'${friendly_name} Setup'"
            text_font: montserrat_28
            text_color: ${ui_ink}
        - label:
            align: CENTER
            y: 30
            text: "Join it from a phone to\nenter your wifi details"
            text_font: montserrat_14
            text_color: ${ui_ink}
            text_align: CENTER
        # For phones that don't pop the captive portal up by themselves.
        # 192.168.4.1 is ESPHome's default fallback AP address.
        - label:
            align: CENTER
            y: 80
            text: "Then open http://192.168.4.1"
            text_font: montserrat_14
            text_color: ${ui_quiet}
    - id: main_page
      bg_color: ${ui_bg}
      bg_opa: COVER
      # The pixel shift pushes main_content a few pixels past the edge; that
      # must not make the page scrollable.
      scrollable: false
      widgets:
        # Everything on the page lives in this transparent, full-size
        # container, which shift_pixels moves as one.
        - obj:
            id: main_content
            x: 0
            y: 0
            width: 480
            height: 800
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            radius: 0
            scrollable: false
            clickable: false
            widgets:
              # --- Header ----------------------------------------------------
              - label:
                  x: 28
                  y: 18
                  text: "Basement"
                  text_font: ui_font_24
                  text_color: ${ui_ink}
              - label:
                  id: lbl_clock
                  align: TOP_RIGHT
                  x: -28
                  y: 21
                  text: ""
                  text_font: ui_font_22
                  text_color: ${ui_quiet}

              # --- Rows ------------------------------------------------------
              # 432x214 each, 14px apart. The halo and icon are positioned
              # from the row's centre (216, 107): halo centre (82, 107).
              - button:
                  id: btn_office
                  x: 24
                  y: 76
                  width: 432
                  height: 214
                  widgets:
                    - obj: &row_halo
                        align: CENTER
                        x: -134
                        y: 0
                        width: 108
                        height: 108
                        radius: 54
                        bg_color: ${ui_off_halo}
                        bg_opa: COVER
                        border_width: 0
                        pad_all: 0
                        scrollable: false
                        clickable: false
                        checked:
                          bg_color: ${ui_amber_halo}
                        pressed:
                          bg_color: ${ui_press_halo}
                    - label: &row_icon
                        align: CENTER
                        x: -134
                        y: 0
                        text: "${icon_desk_lamp}"
                        text_font: icon_font_64
                        text_color: ${ui_quiet}
                        checked:
                          text_color: ${ui_on_amber}
                        pressed:
                          text_color: ${ui_ink}
                    - label: &toggle_pill
                        id: pill_office
                        align: TOP_RIGHT
                        x: -23
                        y: 23
                        text: "--"
                        text_font: ui_font_pill
                        text_letter_space: 2
                        text_color: ${ui_quiet}
                        bg_color: ${ui_off_halo}
                        bg_opa: COVER
                        radius: 15
                        pad_left: 13
                        pad_right: 11
                        pad_top: 6
                        pad_bottom: 6
                        checked:
                          text_color: ${ui_on_amber}
                          bg_color: 0x000000
                          bg_opa: 20%
                        pressed:
                          text_color: ${ui_ink}
                          bg_color: ${ui_press_halo}
                          bg_opa: COVER
                    - label: &row_name
                        x: 159
                        y: 72
                        text: "Office"
                        text_font: ui_font_30
                        text_color: ${ui_ink}
                        checked:
                          text_color: ${ui_on_amber}
                        pressed:
                          text_color: ${ui_ink}
                    - label: &row_sub
                        x: 159
                        y: 117
                        text: "Lamp · Desk light · Socket"
                        text_font: ui_font_14
                        text_color: ${ui_quiet}
                        checked:
                          text_color: ${ui_on_amber}
                        pressed:
                          text_color: ${ui_quiet}
                  on_click:
                    - homeassistant.service:
                        service: light.toggle
                        data:
