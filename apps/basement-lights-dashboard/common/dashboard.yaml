# =============================================================================
# DASHBOARD APP LOGIC - shared by every board and screen layout
# =============================================================================
# WiFi/API/logger, OTA + auto-update checking (the same http_request-manifest
# mechanism as media-room-dashboard and espframe), and the toggles' Home
# Assistant side: three toggles, Office, Board Games and All, each bound to a
# Home Assistant light group and called directly over the native API
# (`homeassistant.service`, in each layout's buttons). Each toggle's state
# comes back down the same connection through `homeassistant` text sensors
# subscribed to exactly those groups, all `internal: true`. It's a remote with
# feedback, not a general HA dashboard. A group reads "on" while any of its
# lights is on, so the panel never needs a reflash when a group's members
# change: that's an edit in HA.
#
# The only entities it exposes are diagnostics (firmware version, IP
# address) and firmware update controls, also shown in the unprotected web
# portal at http://<device-ip>/ (see web_server below).
#
# Everything about the screen lives in a layout package, layouts/<name>.yaml:
# the fonts, the `lvgl:` pages, and when the screen goes idle (the CrowPanel
# 5" turns its backlight off on no motion, COM-533; the Freenove 2.8" shows a
# dimmed floating clock, COM-629). A build includes a board, this file and one
# layout. A layout must provide:
#   - pages `connecting_page`, `setup_page` and `main_page`;
#   - buttons `btn_office`, `btn_games`, `btn_all`, each with a pill label
#     `pill_office`, `pill_games`, `pill_all`, and a header clock `lbl_clock`;
#   - `lbl_connecting_ip` on connecting_page;
#   - a `wake_screen` script that ends the idle state and sets
#     `screen_idle` false.
# A layout adds to this file's scripts and triggers with `!extend` (scripts)
# or by repeating a trigger key (lists from packages are appended), rather
# than editing them here.
# =============================================================================

substitutions:
  firmware_version: "dev"
  # No firmware_manifest_url default on purpose: both boards are ESP32-S3s, so
  # a build that forgot to set its own would poll another board's firmware
  # (COM-427). Each builds/<board>.yaml sets it.
  # The three HA light groups (COM-533). Membership lives in HA.
  office_group: "light.dad_s_office_lights"
  games_group: "light.basement_board_games"
  all_group: "light.basement_lights"
  # main_page palette, shared with media-room-dashboard (COM-530/531). Flat
  # fills only: the panels are RGB565, so gradients band.
  ui_bg: 0x0B0E13
  ui_card: 0x1A1F27
  ui_card_edge: 0x262C36
  ui_press: 0x2C3440
  ui_press_halo: 0x38414F
  ui_ink: 0xF2F4F7
  ui_quiet: 0x8A93A3
  ui_faint: 0x5B6474
  ui_amber: 0xF5A623
  ui_amber_halo: 0xFFC861
  ui_on_amber: 0x1A1205
  ui_off_halo: 0x222833
  # Material Design Icons codepoints, see each layout's icon font.
  icon_desk_lamp: "\U000F095F"
  icon_dice: "\U000F076E"
  icon_home_bulb: "\U000F1251"

esphome:
  project:
    name: "compton-diy.basement-lights-dashboard"
    version: "${firmware_version}"
  on_boot:
    - priority: -200
      then:
        # Each toggle passes its pressed/checked state on to its halo, icon,
        # name, subtitle and pill, which colour themselves per state;
        # inheritance from the button can't give them different colours
        # (same trick as media-room-dashboard's light tiles, COM-531).
        - lambda: |-
            for (lv_obj_t *btn : {id(btn_office), id(btn_games), id(btn_all)})
              lv_obj_add_flag(btn, LV_OBJ_FLAG_STATE_TRICKLE);

# No compile-time ssid/password: credentials come from the captive-portal
# setup flow at first boot and live in NVS, so they survive OTA updates.
wifi:
  ap:
    ssid: "${friendly_name} Setup"
  # on_connect/on_disconnect only fire on a real connected<->disconnected
  # edge, so the interval below watches for the fallback AP itself and swaps
  # in setup_page once. These reset its one-shot guard.
  on_connect:
    - globals.set:
        id: setup_page_shown
        value: "false"
    - lvgl.page.show: main_page
  on_disconnect:
    - globals.set:
        id: setup_page_shown
        value: "false"
    - script.execute: wake_screen
    - lvgl.page.show: connecting_page

globals:
  - id: setup_page_shown
    type: bool
    initial_value: "false"
  # True while the screen is idle: backlight off on the CrowPanel, the
  # floating clock on the Freenove. Set by the layout, cleared by its
  # wake_screen.
  - id: screen_idle
    type: bool
    initial_value: "false"

interval:
  # Moves from connecting_page to setup_page once the fallback AP is up.
  - interval: 1s
    then:
      - if:
          condition:
            and:
              - wifi.ap_active:
              - lambda: 'return !id(setup_page_shown);'
          then:
            - globals.set:
                id: setup_page_shown
                value: "true"
            - script.execute: wake_screen
            - lvgl.page.show: setup_page
  # Install a published update while nobody is using the panel: while the
  # layout's idle state is on (the Freenove's screen saver after 2 min with no
  # touch; the CrowPanel's backlight off after 1 h with no motion or touch).
  # The flash and reboot take about a minute.
  # Unversioned "dev" builds never auto-install: they always mismatch the
  # manifest, so they'd replace a build someone is testing. Install Firmware
  # Update does it on demand.
  - interval: 15min
    then:
      - if:
          condition:
            and:
              - update.is_available: firmware_update
              - lambda: 'return id(screen_idle) && strcmp("${firmware_version}", "dev") != 0;'
          then:
            - logger.log:
                format: "Screen idle: installing firmware update"
                level: INFO
            - update.perform: firmware_update

captive_portal:

# -----------------------------------------------------------------------------
# Admin portal: ESPHome's stock web UI at http://<device-ip>/ (the address on
# the connecting page, and in the CrowPanel's footer), with the diagnostics,
# the update entity and its Check/Install buttons, and `ota: platform:
# web_server`'s upload form. `local: true` embeds the UI so it works from a
# phone on the setup AP with no internet. Deliberately unprotected, like
# media-room-dashboard, cyd-clock and espframe: anyone on the LAN (or the open
# setup AP) can flash it.
# -----------------------------------------------------------------------------
web_server:
  port: 80
  version: 3
  local: true

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key
  # No reboot when HA stays away: rebooting fixes nothing here, and wifi
  # reconnects by itself.
  reboot_timeout: 0s
  # Once HA is gone the imported states are frozen, so drop every toggle to
  # neutral rather than show state that may no longer be true; HA re-sends
  # every subscribed state on reconnect. Only when no state-subscribed client
  # remains, so an `esphome logs` session ending changes nothing.
  on_client_disconnected:
    - if:
        condition:
          not:
            api.connected:
              state_subscription_only: true
        then:
          - script.execute: reset_toggle_states

# -----------------------------------------------------------------------------
# OTA + update check against the GitHub Pages manifest (see CLAUDE.md's
# "Release workflow"). firmware_manifest_url comes from the build file: the
# CrowPanel polls the shared manifest.json (kept for it by project.json's
# `--shared-manifest crowpanel-5`), the Freenove its own
# manifest-freenove-s3.json.
# -----------------------------------------------------------------------------
http_request:

ota:
  - platform: http_request
  # Upload form in the web portal above.
  - platform: web_server
  # `esphome upload --device <ip>` from a laptop.
  - platform: esphome

update:
  - platform: http_request
    id: firmware_update
    name: "Firmware Update"
    source: ${firmware_manifest_url}
    update_interval: 6h

# The stock web_server v3 UI has no install control on the update entity, so
# the portal gets these. Install isn't skipped on "dev" builds: pressing it on
# a local build replaces it with the published release.
button:
  - platform: template
    name: "Check for Firmware Update"
    icon: "mdi:update"
    entity_category: config
    on_press:
      - component.update: firmware_update
  - platform: template
    name: "Install Firmware Update"
    icon: "mdi:download"
    entity_category: config
    on_press:
      - update.perform: firmware_update

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - script.execute: refresh_clock
    on_time:
      - seconds: 0
        then:
          - script.execute: refresh_clock

text_sensor:
  - platform: template
    name: "Firmware Version"
    entity_category: diagnostic
    # Not `never`: a template sensor with no interval never publishes at all.
    update_interval: 1h
    lambda: 'return {"${firmware_version}"};'

  # Station IP, shown on connecting_page (and wherever a layout's show_ip
  # extension puts it) so the device and its web portal can be found without
  # the router or HA.
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
      on_value:
        - if:
            condition:
              lambda: 'return !x.empty() && x != "0.0.0.0";'
            then:
              - script.execute:
                  id: show_ip
                  ip: !lambda 'return x;'

  # ---------------------------------------------------------------------------
  # Group state imported from HA. Text sensors rather than binary sensors so
  # "unavailable"/"unknown" stay their own values instead of collapsing into
  # off. HA pushes subscribed states to any paired device; no "allow actions"
  # toggle needed for these. The toggles aren't `checkable`, so a tap never
  # flips the highlight by itself: it changes once HA confirms the new state.
  # ---------------------------------------------------------------------------
  - platform: homeassistant
    id: office_state
    entity_id: ${office_group}
    internal: true
    on_value:
      - script.execute: refresh_toggles

  - platform: homeassistant
    id: games_state
    entity_id: ${games_group}
    internal: true
    on_value:
      - script.execute: refresh_toggles

  - platform: homeassistant
    id: all_state
    entity_id: ${all_group}
    internal: true
    on_value:
      - script.execute: refresh_toggles

script:
  # Repaints all three toggles from the imported states: checked (amber) when
  # on, and the pill's ON/OFF ("--" for unavailable/unknown).
  - id: refresh_toggles
    then:
      - lambda: |-
          struct Toggle { lv_obj_t *btn; lv_obj_t *pill; const std::string &state; };
          for (const Toggle &t : {Toggle{id(btn_office), id(pill_office), id(office_state).state},
                                  Toggle{id(btn_games), id(pill_games), id(games_state).state},
                                  Toggle{id(btn_all), id(pill_all), id(all_state).state}}) {
            bool on = t.state == "on";
            if (on)
              lv_obj_add_state(t.btn, LV_STATE_CHECKED);
            else
              lv_obj_remove_state(t.btn, LV_STATE_CHECKED);
            lv_label_set_text(t.pill, on ? "ON" : (t.state == "off" ? "OFF" : "--"));
          }

  - id: reset_toggle_states
    then:
      - lambda: |-
          for (lv_obj_t *btn : {id(btn_office), id(btn_games), id(btn_all)})
            lv_obj_remove_state(btn, LV_STATE_CHECKED);
          for (lv_obj_t *pill : {id(pill_office), id(pill_games), id(pill_all)})
            lv_label_set_text(pill, "--");

  # 12-hour clock in the header, from HA's time. Blank until the first sync.
  - id: refresh_clock
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          if (!now.is_valid()) {
            lv_label_set_text(id(lbl_clock), "");
            return;
          }
          int hour = now.hour % 12;
          char buf[12];
          snprintf(buf, sizeof(buf), "%d:%02d %s", hour == 0 ? 12 : hour, now.minute, now.hour < 12 ? "AM" : "PM");
          lv_label_set_text(id(lbl_clock), buf);

  - id: show_ip
    parameters:
      ip: std::string
    then:
      - lvgl.label.update:
          id: lbl_connecting_ip
          text: !lambda 'return "Not connected\nLast IP: " + ip;'
