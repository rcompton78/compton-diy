# Builds a release on every push to main (and on demand): the firmware, with this
# repo's own GitHub Pages manifest baked in, and the 10" stand's print files.
# Attaches both to a GitHub release, then publishes the update manifest and a
# browser install page to this repo's GitHub Pages. Frames installed from that
# page check that manifest, so they only ever install this repo's releases.
#
# Needs Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Without it the first job stops with a message saying so; nothing is released.
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      version: ${{ steps.info.outputs.version }}
      pages_url: ${{ steps.info.outputs.pages_url }}
    steps:
      - id: info
        name: Check GitHub Pages is on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! pages="$(gh api "repos/$GITHUB_REPOSITORY/pages" 2>/dev/null)"; then
            echo "::error title=GitHub Pages is off::Turn on Pages for this repo (Settings -> Pages -> Build and deployment -> Source: GitHub Actions), then re-run this workflow. Releases publish the update manifest and install page there."
            exit 1
          fi
          if [ "$(jq -r .build_type <<<"$pages")" != "workflow" ]; then
            echo "::error title=Pages source is not GitHub Actions::Set Settings -> Pages -> Build and deployment -> Source to GitHub Actions, then re-run this workflow."
            exit 1
          fi
          url="$(jq -r .html_url <<<"$pages")"
          echo "pages_url=${url%/}" >> "$GITHUB_OUTPUT"
          echo "version=$(date -u +%Y.%m.%d)-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

  firmware:
    needs: preflight
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      FIRMWARE_MANIFEST_URL: ${{ needs.preflight.outputs.pages_url }}/manifest.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install the pinned ESPHome
        run: pip install "esphome==$(python3 -c "import json; print(json.load(open('product/contract/project.json'))['esphome_version'])")"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.platformio
            builds/.esphome/.espressif
          key: esphome-${{ hashFiles('product/contract/project.json') }}
      - name: Compile
        run: scripts/firmware.sh compile
      - name: Package
        run: >
          python3 scripts/release/make_pages.py --version "$RELEASE_VERSION"
          --release-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$RELEASE_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware
          path: dist/firmware
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages
          path: dist/pages
          include-hidden-files: true

  stand:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: hardware/stand-10/.venv
          key: stand-venv-${{ runner.os }}-${{ hashFiles('hardware/stand-10/requirements.txt') }}
      - name: Build the print files
        run: |
          hardware/stand-10/setup.sh
          cd hardware/stand-10 && .venv/bin/python -m stand10.build
      - name: Pack
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: scripts/release/pack_stand.sh "$VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stand
          path: dist/stand

  release:
    needs: [preflight, firmware, stand]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: assets
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Espframe $VERSION" --generate-notes \
            assets/firmware/*.bin assets/stand/*.tar.gz

  pages:
    needs: [preflight, release]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pages
          path: pages
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: pages
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
