# Checks and compiles the 10" firmware on every pull request and on pushes to
# branches other than main (main's pushes are built by release.yml).
# GitHub-hosted runners only; nothing here needs a secret.
name: Build

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Checks
        run: |
          for check in check:schema check:generated check:ownership check:budgets check:firmware-fields \
                       webserver:typecheck test:web-compat test:web-modules test:web-smoke-cli test:helpers; do
            echo "::group::$check"
            npm run -s "$check"
            echo "::endgroup::"
          done
      - name: Timezone table
        run: |
          pip install -r scripts/requirements-timezones.txt
          python3 scripts/check_timezones.py

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install the pinned ESPHome
        run: pip install "esphome==$(python3 -c "import json; print(json.load(open('product/contract/project.json'))['esphome_version'])")"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.platformio
            builds/.esphome/.espressif
          key: esphome-${{ hashFiles('product/contract/project.json') }}
      - name: Compile
        run: scripts/firmware.sh compile
